<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIPMS Analysis Viewer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f6f8;
    color: #24292f;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
}

/* =========================================================
   Header
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid #d8dee4;
}

.controls {
    width: 90%;
    max-width: 90%;
    margin: auto;
    padding: 10px 0;
}

.row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
}

label {
    min-width: 55px;
    font-weight: 600;
}

/* =========================================================
   Top Row
========================================================= */

.top-row {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
}

.top-row select {
    flex: 0 1 300px;
    min-width: 180px;
}

.top-row button {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* =========================================================
   Select / Button
========================================================= */

select,
button {
    padding: 8px 12px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: white;
    font: inherit;
}

select {
    min-width: 260px;
}

button {
    cursor: pointer;
}

button:hover:not(:disabled) {
    border-color: #0969da;
}

button.active {
    background: #ddf4ff;
    border-color: #54aeff;
    color: #0969da;
    font-weight: 600;
}

button:disabled {
    color: #afb8c1;
    cursor: default;
}

.main-tab {
    min-width: 80px;
    font-weight: 600;
}

/* =========================================================
   FE / API / BE Area
========================================================= */

.sub {
    display: none;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #d8dee4;
}

.sub.show {
    display: block;
}

/* =========================================================
   FE Horizontal Scroll
========================================================= */

.fe-row {
    flex-wrap: nowrap;
    width: 100%;
}

.fe-scroll {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 6px;
}

#fes {
    display: flex;
    flex-wrap: nowrap;
    gap: 7px;
    width: max-content;
}

#fes button {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* =========================================================
   API + BE Same Row
========================================================= */

.backend-row {
    align-items: center;
    gap: 28px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 6px;
}

.backend-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
}

.backend-group label {
    min-width: auto;
    font-weight: 700;
}

.backend-buttons {
    display: flex;
    flex-wrap: nowrap;
    gap: 7px;
}

.backend-buttons button {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* =========================================================
   Scrollbar
========================================================= */

.fe-scroll::-webkit-scrollbar,
.backend-row::-webkit-scrollbar,
.top-row::-webkit-scrollbar {
    height: 6px;
}

.fe-scroll::-webkit-scrollbar-track,
.backend-row::-webkit-scrollbar-track,
.top-row::-webkit-scrollbar-track {
    background: #f1f3f5;
    border-radius: 5px;
}

.fe-scroll::-webkit-scrollbar-thumb,
.backend-row::-webkit-scrollbar-thumb,
.top-row::-webkit-scrollbar-thumb {
    background: #afb8c1;
    border-radius: 5px;
}

/* =========================================================
   Status
========================================================= */

.status {
    width: 90%;
    max-width: 90%;
    margin: 10px auto 0;
    color: #57606a;
    font-size: 12px;
}

/* =========================================================
   Viewer
========================================================= */

.viewer {
    width: 90%;
    max-width: 90%;
    margin: 12px auto 50px;
    min-height: 500px;
    padding: 32px 40px;
    background: white;
    border: 1px solid #d8dee4;
    border-radius: 8px;
    overflow-x: auto;
    line-height: 1.7;
}

/* =========================================================
   Markdown
========================================================= */

.viewer h1 {
    font-size: 28px;
    margin-top: 34px;
    padding-bottom: 10px;
    border-bottom: 1px solid #d8dee4;
}

.viewer h1:first-child {
    margin-top: 0;
}

.viewer h2 {
    font-size: 22px;
    margin-top: 30px;
    padding-bottom: 7px;
    border-bottom: 1px solid #d8dee4;
}

.viewer h3 {
    font-size: 18px;
    margin-top: 24px;
}

.viewer h4 {
    font-size: 16px;
    margin-top: 20px;
}

.viewer p {
    margin: 10px 0;
}

.viewer ul,
.viewer ol {
    padding-left: 28px;
}

.viewer li {
    margin: 4px 0;
}

.viewer blockquote {
    margin: 16px 0;
    padding: 4px 16px;
    color: #57606a;
    border-left: 4px solid #d0d7de;
    background: #f6f8fa;
}

/* =========================================================
   Code
========================================================= */

.viewer pre {
    background: #f6f8fa;
    border: 1px solid #d8dee4;
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    line-height: 1.5;
    font-family:
        Consolas,
        "Courier New",
        monospace;
    font-size: 13px;
    white-space: pre;
}

.viewer code {
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

.viewer :not(pre) > code {
    background: #eff1f3;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 90%;
}

/* =========================================================
   Table
========================================================= */

.viewer table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 24px;
    font-size: 13px;
}

.viewer th,
.viewer td {
    border: 1px solid #d0d7de;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
}

.viewer th {
    background: #f6f8fa;
    font-weight: 700;
}

.viewer tr:nth-child(even) td {
    background: #fbfcfd;
}

.viewer hr {
    border: 0;
    border-top: 1px solid #d8dee4;
    margin: 24px 0;
}

/* =========================================================
   Built-in Mermaid / Flowchart
========================================================= */

.mermaid-container {
    width: 100%;
    margin: 22px 0;
    padding: 14px;
    border: 1px solid #d8dee4;
    border-radius: 8px;
    background: #fbfcfd;
    overflow: auto;
}

.mermaid-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    color: #57606a;
    font-size: 12px;
}

.mermaid-title {
    font-weight: 700;
}

.mermaid-scroll {
    width: 100%;
    overflow: auto;
}

.mermaid-svg {
    display: block;
    margin: 0 auto;
    min-width: 500px;
}

.mermaid-node {
    fill: #ffffff;
    stroke: #57606a;
    stroke-width: 1.5;
}

.mermaid-condition {
    fill: #fff8c5;
    stroke: #9a6700;
    stroke-width: 1.5;
}

.mermaid-rounded {
    fill: #ddf4ff;
    stroke: #0969da;
    stroke-width: 1.5;
}

.mermaid-node-text {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
    font-size: 13px;
    fill: #24292f;
}

.mermaid-edge {
    stroke: #57606a;
    stroke-width: 1.5;
    fill: none;
}

.mermaid-edge-label-bg {
    fill: #ffffff;
    stroke: #d0d7de;
    stroke-width: 1;
}

.mermaid-edge-label {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
    font-size: 11px;
    fill: #57606a;
}

.mermaid-error {
    padding: 14px;
    border: 1px solid #cf222e;
    border-radius: 6px;
    background: #ffebe9;
    color: #82071e;
    white-space: pre-wrap;
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #57606a;
}

@media (max-width: 800px) {

    .controls,
    .viewer,
    .status {
        width: 96%;
        max-width: 96%;
    }

    .viewer {
        padding: 22px 18px;
    }

    .top-row select {
        min-width: 160px;
    }
}

</style>
</head>

<body>

<header>

<div class="controls">

    <div class="row top-row">

        <label>화면명</label>

        <select id="screen">
            <option value="">
                화면 선택
            </option>
        </select>

        <button id="pick">
            docs/analysis 선택
        </button>

        <button
            id="screenTab"
            class="main-tab"
            disabled
        >
            SCREEN
        </button>

        <button
            id="feTab"
            class="main-tab"
            disabled
        >
            FE
        </button>

    </div>

    <div
        id="sub"
        class="sub"
    >

        <div class="row fe-row">

            <label>FE</label>

            <div class="fe-scroll">
                <div id="fes"></div>
            </div>

        </div>

        <div
            id="backendRow"
            class="backend-row"
            style="display:none"
        >

            <div
                id="apiRow"
                class="backend-group"
                style="display:none"
            >

                <label>API</label>

                <div
                    id="apis"
                    class="backend-buttons"
                ></div>

            </div>

            <div
                id="beRow"
                class="backend-group"
                style="display:none"
            >

                <label>BE</label>

                <div
                    id="bes"
                    class="backend-buttons"
                ></div>

            </div>

        </div>

    </div>

</div>

</header>

<div
    id="status"
    class="status"
>
    Chrome/Edge에서
    <b>docs/analysis 선택</b>
    버튼으로 분석 폴더를 선택하세요.
</div>

<main
    id="viewer"
    class="viewer"
>

    <div class="empty">
        문서를 선택하면 여기에 표시됩니다.
    </div>

</main>

<script>

/* =========================================================
   State
========================================================= */

const q =
    selector =>
        document.querySelector(
            selector
        );

let root = null;

let data =
    new Map();

let screenName = "";

let action = "";


/* =========================================================
   Escape
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}


/* =========================================================
   Directory
========================================================= */

async function dir(
    handle,
    name
) {

    try {

        return await handle
            .getDirectoryHandle(
                name
            );
    }
    catch {

        return null;
    }
}


async function file(
    handle,
    name
) {

    try {

        return await handle
            .getFileHandle(
                name
            );
    }
    catch {

        return null;
    }
}


async function mds(
    handle
) {

    const result = [];

    if (!handle) {

        return result;
    }

    for await (
        const [name, item]
        of handle.entries()
    ) {

        if (
            item.kind === "file" &&
            name.toLowerCase().endsWith(".md")
        ) {

            result.push(item);
        }
    }

    return result.sort(
        (a, b) =>
            a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );
}


/* =========================================================
   Filename
========================================================= */

function act(name) {

    const match =
        name.match(
            /^FE-(ACT-\d+)/i
        );

    return match
        ? match[1].toUpperCase()
        : "";
}


function feLabel(name) {

    const match =
        name.match(
            /^FE-(ACT-\d+)-(.+)\.md$/i
        );

    if (!match) {

        return name.replace(
            /\.md$/i,
            ""
        );
    }

    return (
        match[1] +
        " " +
        match[2].replaceAll(
            "-",
            " "
        )
    );
}


function child(
    name,
    actionId,
    type
) {

    const upper =
        name.toUpperCase();

    return (
        upper.startsWith(
            "FE-" +
            actionId +
            "-"
        )
        &&
        upper.includes(
            "-" +
            type +
            "-"
        )
    );
}


function childLabel(
    name,
    type
) {

    const regex =
        new RegExp(
            "-(" +
            type +
            "-\\d+)\\.md$",
            "i"
        );

    const match =
        name.match(regex);

    return match
        ? match[1].toUpperCase()
        : name.replace(
            /\.md$/i,
            ""
        );
}


/* =========================================================
   Active
========================================================= */

function setMainActive(button) {

    q("#screenTab")
        .classList
        .remove("active");

    q("#feTab")
        .classList
        .remove("active");

    if (button) {

        button
            .classList
            .add("active");
    }
}


/* =========================================================
   Render File
========================================================= */

async function renderFile(handle) {

    if (!handle) {

        return;
    }

    try {

        const target =
            await handle.getFile();

        const markdown =
            await target.text();

        renderMarkdown(markdown);

        q("#status").innerHTML =
            "표시 문서: <b>" +
            escapeHtml(handle.name) +
            "</b>";
    }
    catch (error) {

        q("#viewer").innerHTML =
            '<div class="empty">' +
            '문서를 읽을 수 없습니다.<br>' +
            escapeHtml(error.message) +
            '</div>';
    }
}


/* =========================================================
   Scan
========================================================= */

async function scan() {

    data.clear();

    for await (
        const [name, handle]
        of root.entries()
    ) {

        if (
            handle.kind !==
            "directory"
        ) {

            continue;
        }

        const screen =
            await file(
                handle,
                "SCREEN-" +
                name +
                ".md"
            );

        const frontend =
            await dir(
                handle,
                "frontend"
            );

        const api =
            await dir(
                handle,
                "api"
            );

        const backend =
            await dir(
                handle,
                "backend"
            );

        if (
            screen ||
            frontend ||
            api ||
            backend
        ) {

            data.set(
                name,
                {
                    screen,
                    frontend,
                    api,
                    backend
                }
            );
        }
    }

    const select =
        q("#screen");

    select.innerHTML =
        '<option value="">' +
        '화면 선택' +
        '</option>';

    [...data.keys()]

        .sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        )

        .forEach(
            name => {

                select.add(
                    new Option(
                        name,
                        name
                    )
                );
            }
        );

    q("#status").textContent =
        data.size +
        "개 화면을 찾았습니다.";
}


/* =========================================================
   Folder Picker
========================================================= */

q("#pick").onclick =
async () => {

    if (
        !window.showDirectoryPicker
    ) {

        alert(
            "현재 브라우저에서는 폴더 선택 기능을 지원하지 않습니다.\n\n" +
            "Chrome 또는 Edge 최신 버전에서 실행해 주세요."
        );

        return;
    }

    try {

        root =
            await window.showDirectoryPicker({
                mode: "read"
            });

        await scan();

    }
    catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(error);
        }
    }
};


/* =========================================================
   Screen Change
========================================================= */

q("#screen").onchange =
async event => {

    screenName =
        event.target.value;

    action = "";

    q("#sub")
        .classList
        .remove("show");

    q("#backendRow")
        .style.display =
        "none";

    q("#screenTab")
        .disabled =
        !screenName;

    q("#feTab")
        .disabled =
        !screenName;

    if (!screenName) {

        return;
    }

    await showScreen();
};


/* =========================================================
   SCREEN
========================================================= */

async function showScreen() {

    const current =
        data.get(screenName);

    if (!current) {

        return;
    }

    q("#sub")
        .classList
        .remove("show");

    q("#backendRow")
        .style.display =
        "none";

    setMainActive(
        q("#screenTab")
    );

    if (
        current.screen
    ) {

        await renderFile(
            current.screen
        );
    }
    else {

        q("#viewer").innerHTML =
            '<div class="empty">' +
            'SCREEN 문서가 없습니다.' +
            '</div>';
    }
}


q("#screenTab").onclick =
    showScreen;


/* =========================================================
   FE
========================================================= */

q("#feTab").onclick =
async () => {

    const current =
        data.get(screenName);

    if (!current) {

        return;
    }

    setMainActive(
        q("#feTab")
    );

    q("#sub")
        .classList
        .add("show");

    q("#fes").innerHTML = "";

    q("#apis").innerHTML = "";

    q("#bes").innerHTML = "";

    q("#apiRow")
        .style.display =
        "none";

    q("#beRow")
        .style.display =
        "none";

    q("#backendRow")
        .style.display =
        "none";

    const frontendFiles =
        await mds(
            current.frontend
        );

    if (
        !frontendFiles.length
    ) {

        q("#fes").textContent =
            "FE 문서 없음";

        q("#viewer").innerHTML =
            '<div class="empty">' +
            '이 화면에는 FE 문서가 없습니다.' +
            '</div>';

        return;
    }

    frontendFiles.forEach(
        handle => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                feLabel(
                    handle.name
                );

            button.title =
                handle.name;

            button.onclick =
                () =>
                    selectFE(
                        handle,
                        button
                    );

            q("#fes")
                .appendChild(
                    button
                );
        }
    );

    q("#viewer").innerHTML =
        '<div class="empty">' +
        'FE 기능을 선택하세요.' +
        '</div>';
};


/* =========================================================
   Select FE
========================================================= */

async function selectFE(
    handle,
    button
) {

    action =
        act(
            handle.name
        );

    document
        .querySelectorAll(
            "#fes button"
        )
        .forEach(
            item =>
                item.classList
                    .remove("active")
        );

    button
        .classList
        .add("active");

    setMainActive(
        q("#feTab")
    );

    await renderFile(
        handle
    );

    const current =
        data.get(screenName);

    const apiFiles =
        (
            await mds(
                current.api
            )
        )
        .filter(
            item =>
                child(
                    item.name,
                    action,
                    "API"
                )
        );

    const backendFiles =
        (
            await mds(
                current.backend
            )
        )
        .filter(
            item =>
                child(
                    item.name,
                    action,
                    "BE"
                )
        );

    fillChildren(
        "#apis",
        "#apiRow",
        apiFiles,
        "API"
    );

    fillChildren(
        "#bes",
        "#beRow",
        backendFiles,
        "BE"
    );

    if (
        apiFiles.length ||
        backendFiles.length
    ) {

        q("#backendRow")
            .style.display =
            "flex";
    }
    else {

        q("#backendRow")
            .style.display =
            "none";
    }
}


/* =========================================================
   API / BE Buttons
========================================================= */

function fillChildren(
    box,
    row,
    items,
    type
) {

    const container =
        q(box);

    container.innerHTML =
        "";

    if (
        !items.length
    ) {

        q(row)
            .style.display =
            "none";

        return;
    }

    q(row)
        .style.display =
        "flex";

    items.forEach(
        handle => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                childLabel(
                    handle.name,
                    type
                );

            button.title =
                handle.name;

            button.onclick =
async () => {

    document
        .querySelectorAll(
            "#apis button, #bes button"
        )
        .forEach(
            item =>
                item.classList
                    .remove("active")
        );

    button
        .classList
        .add("active");

    setMainActive(
        q("#feTab")
    );

    await renderFile(
        handle
    );
};

            container
                .appendChild(
                    button
                );
        }
    );
}


/* =========================================================
   Markdown Renderer
========================================================= */

function renderMarkdown(markdown) {

    const html =
        markdownToHtml(
            markdown
        );

    q("#viewer").innerHTML =
        html;

    renderBuiltInMermaid();
}


/* =========================================================
   Markdown → HTML
========================================================= */

function markdownToHtml(markdown) {

    markdown =
        markdown.replace(
            /\r\n/g,
            "\n"
        );

    const lines =
        markdown.split("\n");

    let html = "";

    let index = 0;

    let inCode = false;

    let codeLanguage = "";

    let codeBuffer = [];

    let listType = null;

    let mermaidIndex = 0;


    while (
        index < lines.length
    ) {

        const line =
            lines[index];


        /* =================================================
           Code Block
        ================================================= */

        if (
            line.trim()
                .startsWith("```")
        ) {

            closeList();

            if (!inCode) {

                inCode = true;

                codeLanguage =
                    line
                        .trim()
                        .substring(3)
                        .trim()
                        .toLowerCase();

                codeBuffer = [];
            }
            else {

                /*
                   Mermaid이면 일반 code block이 아니라
                   전용 영역으로 만든다.
                */

                if (
                    codeLanguage ===
                    "mermaid"
                ) {

                    mermaidIndex++;

                    html +=
                        '<div class="mermaid-container">' +

                            '<div class="mermaid-toolbar">' +

                                '<span class="mermaid-title">' +
                                    'Flowchart' +
                                '</span>' +

                                '<span>' +
                                    '내장 Renderer' +
                                '</span>' +

                            '</div>' +

                            '<div class="mermaid-scroll">' +

                                '<div ' +
                                    'class="builtin-mermaid" ' +
                                    'data-mermaid-id="' +
                                    mermaidIndex +
                                    '"' +
                                '>' +

                                    '<pre class="mermaid-source" style="display:none">' +
                                        escapeHtml(
                                            codeBuffer.join("\n")
                                        ) +
                                    '</pre>' +

                                '</div>' +

                            '</div>' +

                        '</div>';
                }
                else {

                    html +=
                        "<pre><code" +

                        (
                            codeLanguage

                                ? ' class="language-' +
                                  escapeAttribute(
                                      codeLanguage
                                  ) +
                                  '"'

                                : ""
                        )

                        + ">" +

                        escapeHtml(
                            codeBuffer.join("\n")
                        )

                        + "</code></pre>";
                }

                inCode = false;

                codeLanguage = "";

                codeBuffer = [];
            }

            index++;

            continue;
        }


        if (inCode) {

            codeBuffer.push(
                line
            );

            index++;

            continue;
        }


        /* =================================================
           Table
        ================================================= */

        if (
            isTableHeader(
                lines,
                index
            )
        ) {

            closeList();

            const result =
                parseTable(
                    lines,
                    index
                );

            html +=
                result.html;

            index =
                result.nextIndex;

            continue;
        }


        /* =================================================
           Blank
        ================================================= */

        if (
            line.trim() === ""
        ) {

            closeList();

            index++;

            continue;
        }


        /* =================================================
           HR
        ================================================= */

        if (
            /^(\s*)(---|\*\*\*|___)(\s*)$/
                .test(line)
        ) {

            closeList();

            html += "<hr>";

            index++;

            continue;
        }


        /* =================================================
           Heading
        ================================================= */

        const headingMatch =
            line.match(
                /^(#{1,6})\s+(.+)$/
            );

        if (headingMatch) {

            closeList();

            const level =
                headingMatch[1].length;

            html +=
                "<h" +
                level +
                ">" +

                inlineMarkdown(
                    headingMatch[2]
                ) +

                "</h" +
                level +
                ">";

            index++;

            continue;
        }


        /* =================================================
           Blockquote
        ================================================= */

        if (
            line
                .trimStart()
                .startsWith(">")
        ) {

            closeList();

            const quoteLines =
                [];

            while (
                index < lines.length &&
                lines[index]
                    .trimStart()
                    .startsWith(">")
            ) {

                quoteLines.push(
                    lines[index]
                        .trimStart()
                        .replace(
                            /^>\s?/,
                            ""
                        )
                );

                index++;
            }

            html +=
                "<blockquote>" +

                quoteLines
                    .map(
                        item =>
                            item.trim()

                                ? inlineMarkdown(
                                    item
                                )

                                : "<br>"
                    )
                    .join("<br>") +

                "</blockquote>";

            continue;
        }


        /* =================================================
           UL
        ================================================= */

        const ulMatch =
            line.match(
                /^\s*[-*+]\s+(.+)$/
            );

        if (ulMatch) {

            if (
                listType !== "ul"
            ) {

                closeList();

                html += "<ul>";

                listType = "ul";
            }

            html +=
                "<li>" +

                inlineMarkdown(
                    ulMatch[1]
                ) +

                "</li>";

            index++;

            continue;
        }


        /* =================================================
           OL
        ================================================= */

        const olMatch =
            line.match(
                /^\s*\d+\.\s+(.+)$/
            );

        if (olMatch) {

            if (
                listType !== "ol"
            ) {

                closeList();

                html += "<ol>";

                listType = "ol";
            }

            html +=
                "<li>" +

                inlineMarkdown(
                    olMatch[1]
                ) +

                "</li>";

            index++;

            continue;
        }


        /* =================================================
           Paragraph
        ================================================= */

        closeList();

        const paragraphLines =
            [line];

        index++;

        while (
            index < lines.length
        ) {

            const next =
                lines[index];

            if (
                next.trim() === "" ||

                next
                    .trim()
                    .startsWith("```") ||

                /^#{1,6}\s+/
                    .test(next) ||

                /^(\s*)(---|\*\*\*|___)(\s*)$/
                    .test(next) ||

                next
                    .trimStart()
                    .startsWith(">") ||

                /^\s*[-*+]\s+/
                    .test(next) ||

                /^\s*\d+\.\s+/
                    .test(next) ||

                isTableHeader(
                    lines,
                    index
                )
            ) {

                break;
            }

            paragraphLines.push(
                next
            );

            index++;
        }

        html +=
            "<p>" +

            paragraphLines
                .map(
                    item =>
                        inlineMarkdown(
                            item
                        )
                )
                .join("<br>") +

            "</p>";
    }


    if (inCode) {

        html +=
            "<pre><code>" +

            escapeHtml(
                codeBuffer.join("\n")
            ) +

            "</code></pre>";
    }


    closeList();

    return html;


    function closeList() {

        if (
            listType === "ul"
        ) {

            html += "</ul>";
        }

        if (
            listType === "ol"
        ) {

            html += "</ol>";
        }

        listType = null;
    }
}


/* =========================================================
   Markdown Table
========================================================= */

function isTableHeader(
    lines,
    index
) {

    if (
        index + 1 >=
        lines.length
    ) {

        return false;
    }

    const first =
        lines[index].trim();

    const second =
        lines[index + 1].trim();

    if (
        !first.includes("|") ||
        !second.includes("|")
    ) {

        return false;
    }

    const cells =
        splitTableRow(
            second
        );

    if (
        cells.length === 0
    ) {

        return false;
    }

    return cells.every(
        cell =>
            /^:?-{3,}:?$/
                .test(
                    cell.trim()
                )
    );
}


function parseTable(
    lines,
    startIndex
) {

    const headers =
        splitTableRow(
            lines[startIndex]
        );

    let index =
        startIndex + 2;

    const rows = [];

    while (
        index < lines.length
    ) {

        const line =
            lines[index].trim();

        if (
            line === "" ||
            !line.includes("|")
        ) {

            break;
        }

        rows.push(
            splitTableRow(
                line
            )
        );

        index++;
    }

    let html =
        "<table><thead><tr>";

    for (
        const header
        of headers
    ) {

        html +=
            "<th>" +

            inlineMarkdown(
                header.trim()
            ) +

            "</th>";
    }

    html +=
        "</tr></thead><tbody>";

    for (
        const row
        of rows
    ) {

        html += "<tr>";

        for (
            let column = 0;
            column < headers.length;
            column++
        ) {

            const value =
                row[column] ?? "";

            html +=
                "<td>" +

                inlineMarkdown(
                    value.trim()
                ) +

                "</td>";
        }

        html += "</tr>";
    }

    html +=
        "</tbody></table>";

    return {
        html: html,
        nextIndex: index
    };
}


function splitTableRow(line) {

    let value =
        line.trim();

    if (
        value.startsWith("|")
    ) {

        value =
            value.substring(1);
    }

    if (
        value.endsWith("|")
    ) {

        value =
            value.substring(
                0,
                value.length - 1
            );
    }

    return value.split("|");
}


/* =========================================================
   Inline Markdown
========================================================= */

function inlineMarkdown(text) {

    let value =
        escapeHtml(text);

    value =
        value.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

    value =
        value.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );

    /*
       lookbehind를 사용하지 않는다.
       회사 PC의 오래된 브라우저에서도
       최대한 오류가 나지 않도록 단순 처리.
    */

    value =
        value.replace(
            /(^|[^*])\*([^*]+)\*/g,
            "$1<em>$2</em>"
        );

    return value;
}


/* =========================================================
   Built-in Mermaid Renderer
========================================================= */

function renderBuiltInMermaid() {

    const elements =
        document.querySelectorAll(
            ".builtin-mermaid"
        );

    elements.forEach(
        element => {

            const sourceElement =
                element.querySelector(
                    ".mermaid-source"
                );

            if (!sourceElement) {

                return;
            }

            const source =
                sourceElement.textContent;

            try {

                const graph =
                    parseMermaidFlowchart(
                        source
                    );

                element.innerHTML =
                    createFlowchartSvg(
                        graph
                    );
            }
            catch (error) {

                console.error(
                    "Flowchart 렌더링 오류",
                    error
                );

                element.innerHTML =
                    '<div class="mermaid-error">' +
                    'Flowchart를 표시하지 못했습니다.\n\n' +
                    escapeHtml(
                        error.message
                    ) +
                    '</div>';
            }
        }
    );
}


/* =========================================================
   Mermaid Parser
========================================================= */

function parseMermaidFlowchart(source) {

    const lines =
        source
            .replace(/\r\n/g, "\n")
            .split("\n");

    const graph = {
        direction: "TD",
        nodes: new Map(),
        edges: []
    };

    let firstMeaningfulLine =
        true;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        let line =
            lines[i].trim();

        if (
            !line ||
            line.startsWith("%%")
        ) {

            continue;
        }

        /*
           flowchart TD
           graph TD
        */

        if (
            firstMeaningfulLine
        ) {

            const header =
                line.match(
                    /^(?:flowchart|graph)\s+(TD|TB|BT|LR|RL)\s*;?$/i
                );

            if (header) {

                graph.direction =
                    header[1]
                        .toUpperCase();

                firstMeaningfulLine =
                    false;

                continue;
            }

            firstMeaningfulLine =
                false;
        }

        /*
           subgraph / end는
           현재 경량 renderer에서는
           구조 계산에서 제외한다.
        */

        if (
            /^subgraph\b/i.test(line) ||
            /^end\s*;?$/i.test(line)
        ) {

            continue;
        }

        /*
           Mermaid는 한 줄 끝에 ;를
           사용할 수 있으므로 제거.
        */

        if (
            line.endsWith(";")
        ) {

            line =
                line.substring(
                    0,
                    line.length - 1
                )
                .trim();
        }

        /*
           Edge가 있는 줄
        */

        if (
            line.includes("-->") ||
            line.includes("---")
        ) {

            parseMermaidEdgeLine(
                line,
                graph
            );

            continue;
        }

        /*
           Node 단독 선언
        */

        const node =
            parseMermaidNode(
                line
            );

        if (node) {

            addMermaidNode(
                graph,
                node
            );
        }
    }

    if (
        graph.nodes.size === 0
    ) {

        throw new Error(
            "표시할 Flowchart Node를 찾지 못했습니다."
        );
    }

    return graph;
}


/* =========================================================
   Edge Parser
========================================================= */

function parseMermaidEdgeLine(
    line,
    graph
) {

    /*
       지원 예:

       A --> B
       A -->|YES| B
       A --- B
       A[FE] --> B{Validation}
    */

    let arrow = null;

    let arrowIndex =
        line.indexOf("-->");

    if (
        arrowIndex >= 0
    ) {

        arrow = "-->";
    }
    else {

        arrowIndex =
            line.indexOf("---");

        if (
            arrowIndex >= 0
        ) {

            arrow = "---";
        }
    }

    if (
        !arrow
    ) {

        return;
    }

    const leftText =
        line
            .substring(
                0,
                arrowIndex
            )
            .trim();

    let rightText =
        line
            .substring(
                arrowIndex +
                arrow.length
            )
            .trim();

    let label = "";

    /*
       -->|YES| B
    */

    if (
        rightText.startsWith("|")
    ) {

        const secondBar =
            rightText.indexOf(
                "|",
                1
            );

        if (
            secondBar > 0
        ) {

            label =
                rightText
                    .substring(
                        1,
                        secondBar
                    )
                    .trim();

            rightText =
                rightText
                    .substring(
                        secondBar + 1
                    )
                    .trim();
        }
    }

    const leftNode =
        parseMermaidNode(
            leftText
        );

    const rightNode =
        parseMermaidNode(
            rightText
        );

    if (
        !leftNode ||
        !rightNode
    ) {

        return;
    }

    addMermaidNode(
        graph,
        leftNode
    );

    addMermaidNode(
        graph,
        rightNode
    );

    graph.edges.push({
        from:
            leftNode.id,

        to:
            rightNode.id,

        label:
            label,

        arrow:
            arrow
    });
}


/* =========================================================
   Node Parser
========================================================= */

function parseMermaidNode(text) {

    text =
        text.trim();

    if (!text) {

        return null;
    }

    /*
       ID{Condition}
    */

    let match =
        text.match(
            /^([A-Za-z0-9_.:-]+)\{(.+)\}$/
        );

    if (match) {

        return {
            id:
                match[1],

            label:
                cleanMermaidLabel(
                    match[2]
                ),

            shape:
                "condition"
        };
    }

    /*
       ID([Rounded])
    */

    match =
        text.match(
            /^([A-Za-z0-9_.:-]+)$begin:math:text$\\\[\(\.\+\)\\\]$end:math:text$$/
        );

    if (match) {

        return {
            id:
                match[1],

            label:
                cleanMermaidLabel(
                    match[2]
                ),

            shape:
                "rounded"
        };
    }

    /*
       ID(text)
    */

    match =
        text.match(
            /^([A-Za-z0-9_.:-]+)$begin:math:text$\(\.\+\)$end:math:text$$/
        );

    if (match) {

        return {
            id:
                match[1],

            label:
                cleanMermaidLabel(
                    match[2]
                ),

            shape:
                "rounded"
        };
    }

    /*
       ID[text]
    */

    match =
        text.match(
            /^([A-Za-z0-9_.:-]+)$begin:math:display$\(\.\+\)$end:math:display$$/
        );

    if (match) {

        return {
            id:
                match[1],

            label:
                cleanMermaidLabel(
                    match[2]
                ),

            shape:
                "rect"
        };
    }

    /*
       ID["text"]
    */

    match =
        text.match(
            /^([A-Za-z0-9_.:-]+)$begin:math:display$\"\(\.\+\)\"$end:math:display$$/
        );

    if (match) {

        return {
            id:
                match[1],

            label:
                cleanMermaidLabel(
                    match[2]
                ),

            shape:
                "rect"
        };
    }

    /*
       ID
    */

    match =
        text.match(
            /^([A-Za-z0-9_.:-]+)$/
        );

    if (match) {

        return {
            id:
                match[1],

            label:
                match[1],

            shape:
                "rect"
        };
    }

    return null;
}


function cleanMermaidLabel(value) {

    let result =
        String(value)
            .trim();

    if (
        result.startsWith('"') &&
        result.endsWith('"')
    ) {

        result =
            result.substring(
                1,
                result.length - 1
            );
    }

    /*
       Mermaid에서 흔히 쓰는 <br/>
    */

    result =
        result.replace(
            /<br\s*\/?>/gi,
            "\n"
        );

    return result;
}


function addMermaidNode(
    graph,
    node
) {

    if (
        graph.nodes.has(
            node.id
        )
    ) {

        const old =
            graph.nodes.get(
                node.id
            );

        /*
           단순 ID로 먼저 등록됐다가
           나중에 실제 label 선언이 나오면
           실제 선언으로 교체.
        */

        if (
            old.label === old.id &&
            node.label !== node.id
        ) {

            graph.nodes.set(
                node.id,
                node
            );
        }

        return;
    }

    graph.nodes.set(
        node.id,
        node
    );
}


/* =========================================================
   SVG Flowchart
========================================================= */

function createFlowchartSvg(
    graph
) {

    const nodes =
        Array.from(
            graph.nodes.values()
        );

    const horizontal =
        graph.direction === "LR" ||
        graph.direction === "RL";

    const reverse =
        graph.direction === "BT" ||
        graph.direction === "RL";

    const nodeWidth =
        220;

    const nodeHeight =
        68;

    const gapX =
        100;

    const gapY =
        80;

    /*
       간단한 Layer 계산
    */

    const levels =
        calculateGraphLevels(
            graph
        );

    let maxLevel = 0;

    levels.forEach(
        level => {

            if (
                level > maxLevel
            ) {

                maxLevel =
                    level;
            }
        }
    );

    const levelGroups =
        new Map();

    nodes.forEach(
        node => {

            let level =
                levels.get(
                    node.id
                ) || 0;

            if (reverse) {

                level =
                    maxLevel -
                    level;
            }

            if (
                !levelGroups.has(
                    level
                )
            ) {

                levelGroups.set(
                    level,
                    []
                );
            }

            levelGroups
                .get(level)
                .push(node);
        }
    );

    const positions =
        new Map();

    let maxItems =
        1;

    levelGroups.forEach(
        items => {

            if (
                items.length >
                maxItems
            ) {

                maxItems =
                    items.length;
            }
        }
    );

    const margin =
        60;

    let width;
    let height;

    if (horizontal) {

        width =
            margin * 2 +
            (maxLevel + 1) *
            nodeWidth +
            maxLevel *
            gapX;

        height =
            margin * 2 +
            maxItems *
            nodeHeight +
            Math.max(
                0,
                maxItems - 1
            ) *
            gapY;
    }
    else {

        width =
            margin * 2 +
            maxItems *
            nodeWidth +
            Math.max(
                0,
                maxItems - 1
            ) *
            gapX;

        height =
            margin * 2 +
            (maxLevel + 1) *
            nodeHeight +
            maxLevel *
            gapY;
    }

    /*
       최소 크기
    */

    width =
        Math.max(
            width,
            600
        );

    height =
        Math.max(
            height,
            260
        );


    /*
       Node 위치
    */

    levelGroups.forEach(
        (items, level) => {

            items.forEach(
                (node, itemIndex) => {

                    let x;
                    let y;

                    if (horizontal) {

                        x =
                            margin +
                            level *
                            (
                                nodeWidth +
                                gapX
                            );

                        const totalHeight =
                            items.length *
                            nodeHeight +
                            Math.max(
                                0,
                                items.length - 1
                            ) *
                            gapY;

                        const startY =
                            (
                                height -
                                totalHeight
                            ) / 2;

                        y =
                            startY +
                            itemIndex *
                            (
                                nodeHeight +
                                gapY
                            );
                    }
                    else {

                        y =
                            margin +
                            level *
                            (
                                nodeHeight +
                                gapY
                            );

                        const totalWidth =
                            items.length *
                            nodeWidth +
                            Math.max(
                                0,
                                items.length - 1
                            ) *
                            gapX;

                        const startX =
                            (
                                width -
                                totalWidth
                            ) / 2;

                        x =
                            startX +
                            itemIndex *
                            (
                                nodeWidth +
                                gapX
                            );
                    }

                    positions.set(
                        node.id,
                        {
                            x: x,
                            y: y,
                            width:
                                nodeWidth,
                            height:
                                nodeHeight
                        }
                    );
                }
            );
        }
    );


    /*
       SVG
    */

    let svg =
        '<svg ' +
        'class="mermaid-svg" ' +
        'xmlns="http://www.w3.org/2000/svg" ' +
        'width="' +
        width +
        '" ' +
        'height="' +
        height +
        '" ' +
        'viewBox="0 0 ' +
        width +
        ' ' +
        height +
        '">' +

        '<defs>' +

            '<marker ' +
                'id="flow-arrow" ' +
                'viewBox="0 0 10 10" ' +
                'refX="9" ' +
                'refY="5" ' +
                'markerWidth="7" ' +
                'markerHeight="7" ' +
                'orient="auto-start-reverse">' +

                '<path ' +
                    'd="M 0 0 L 10 5 L 0 10 z" ' +
                    'fill="#57606a">' +
                '</path>' +

            '</marker>' +

        '</defs>';


    /*
       Edge 먼저 그림
    */

    graph.edges.forEach(
        edge => {

            const from =
                positions.get(
                    edge.from
                );

            const to =
                positions.get(
                    edge.to
                );

            if (
                !from ||
                !to
            ) {

                return;
            }

            const edgeData =
                createEdgePath(
                    from,
                    to,
                    horizontal
                );

            svg +=
                '<path ' +
                    'class="mermaid-edge" ' +
                    'd="' +
                    edgeData.path +
                    '"' +

                    (
                        edge.arrow === "-->"
                            ? ' marker-end="url(#flow-arrow)"'
                            : ""
                    ) +

                '></path>';


            if (
                edge.label
            ) {

                const labelWidth =
                    Math.max(
                        42,
                        edge.label.length *
                        8 +
                        16
                    );

                svg +=
                    '<rect ' +
                        'class="mermaid-edge-label-bg" ' +
                        'x="' +
                        (
                            edgeData.labelX -
                            labelWidth / 2
                        ) +
                        '" ' +
                        'y="' +
                        (
                            edgeData.labelY -
                            11
                        ) +
                        '" ' +
                        'width="' +
                        labelWidth +
                        '" ' +
                        'height="22" ' +
                        'rx="4">' +
                    '</rect>';

                svg +=
                    '<text ' +
                        'class="mermaid-edge-label" ' +
                        'x="' +
                        edgeData.labelX +
                        '" ' +
                        'y="' +
                        (
                            edgeData.labelY +
                            4
                        ) +
                        '" ' +
                        'text-anchor="middle">' +

                        escapeSvgText(
                            edge.label
                        ) +

                    '</text>';
            }
        }
    );


    /*
       Node
    */

    nodes.forEach(
        node => {

            const pos =
                positions.get(
                    node.id
                );

            if (!pos) {

                return;
            }

            svg +=
                createSvgNode(
                    node,
                    pos
                );
        }
    );


    svg +=
        "</svg>";

    return svg;
}


/* =========================================================
   Graph Levels
========================================================= */

function calculateGraphLevels(
    graph
) {

    const levels =
        new Map();

    const incoming =
        new Map();

    graph.nodes.forEach(
        (node, id) => {

            incoming.set(
                id,
                0
            );

            levels.set(
                id,
                0
            );
        }
    );

    graph.edges.forEach(
        edge => {

            incoming.set(
                edge.to,
                (
                    incoming.get(
                        edge.to
                    ) || 0
                ) + 1
            );
        }
    );

    const queue = [];

    incoming.forEach(
        (count, id) => {

            if (
                count === 0
            ) {

                queue.push(id);
            }
        }
    );

    /*
       순환 구조 때문에 시작점이 없으면
       첫 번째 Node부터 시작.
    */

    if (
        queue.length === 0 &&
        graph.nodes.size > 0
    ) {

        queue.push(
            graph.nodes
                .keys()
                .next()
                .value
        );
    }

    const processed =
        new Set();

    let safety =
        0;

    while (
        queue.length > 0 &&
        safety < 10000
    ) {

        safety++;

        const current =
            queue.shift();

        processed.add(
            current
        );

        const currentLevel =
            levels.get(
                current
            ) || 0;

        graph.edges.forEach(
            edge => {

                if (
                    edge.from !==
                    current
                ) {

                    return;
                }

                const nextLevel =
                    Math.max(
                        levels.get(
                            edge.to
                        ) || 0,

                        currentLevel + 1
                    );

                levels.set(
                    edge.to,
                    nextLevel
                );

                const count =
                    (
                        incoming.get(
                            edge.to
                        ) || 0
                    ) - 1;

                incoming.set(
                    edge.to,
                    count
                );

                if (
                    count <= 0 &&
                    !processed.has(
                        edge.to
                    )
                ) {

                    queue.push(
                        edge.to
                    );
                }
            }
        );
    }

    /*
       아직 처리되지 않은 순환 Node
    */

    graph.nodes.forEach(
        (node, id) => {

            if (
                !levels.has(id)
            ) {

                levels.set(
                    id,
                    0
                );
            }
        }
    );

    return levels;
}


/* =========================================================
   Edge SVG
========================================================= */

function createEdgePath(
    from,
    to,
    horizontal
) {

    let startX;
    let startY;
    let endX;
    let endY;

    if (horizontal) {

        startX =
            from.x +
            from.width;

        startY =
            from.y +
            from.height / 2;

        endX =
            to.x;

        endY =
            to.y +
            to.height / 2;

        const middleX =
            (
                startX +
                endX
            ) / 2;

        return {
            path:
                "M " +
                startX +
                " " +
                startY +

                " C " +
                middleX +
                " " +
                startY +

                ", " +
                middleX +
                " " +
                endY +

                ", " +
                endX +
                " " +
                endY,

            labelX:
                middleX,

            labelY:
                (
                    startY +
                    endY
                ) / 2
        };
    }

    startX =
        from.x +
        from.width / 2;

    startY =
        from.y +
        from.height;

    endX =
        to.x +
        to.width / 2;

    endY =
        to.y;

    const middleY =
        (
            startY +
            endY
        ) / 2;

    return {
        path:
            "M " +
            startX +
            " " +
            startY +

            " C " +
            startX +
            " " +
            middleY +

            ", " +
            endX +
            " " +
            middleY +

            ", " +
            endX +
            " " +
            endY,

        labelX:
            (
                startX +
                endX
            ) / 2,

        labelY:
            middleY
    };
}


/* =========================================================
   Node SVG
========================================================= */

function createSvgNode(
    node,
    pos
) {

    let svg = "";

    const centerX =
        pos.x +
        pos.width / 2;

    const centerY =
        pos.y +
        pos.height / 2;


    if (
        node.shape ===
        "condition"
    ) {

        const top =
            centerX +
            "," +
            pos.y;

        const right =
            (
                pos.x +
                pos.width
            ) +
            "," +
            centerY;

        const bottom =
            centerX +
            "," +
            (
                pos.y +
                pos.height
            );

        const left =
            pos.x +
            "," +
            centerY;

        svg +=
            '<polygon ' +
                'class="mermaid-condition" ' +
                'points="' +
                top +
                " " +
                right +
                " " +
                bottom +
                " " +
                left +
                '">' +
            '</polygon>';
    }
    else {

        const className =
            node.shape ===
            "rounded"

                ? "mermaid-rounded"

                : "mermaid-node";

        svg +=
            '<rect ' +
                'class="' +
                className +
                '" ' +
                'x="' +
                pos.x +
                '" ' +
                'y="' +
                pos.y +
                '" ' +
                'width="' +
                pos.width +
                '" ' +
                'height="' +
                pos.height +
                '" ' +
                'rx="' +
                (
                    node.shape ===
                    "rounded"
                        ? 28
                        : 6
                ) +
                '">' +
            '</rect>';
    }


    svg +=
        createSvgMultilineText(
            node.label,
            centerX,
            centerY
        );

    return svg;
}


/* =========================================================
   Multiline Text
========================================================= */

function createSvgMultilineText(
    text,
    x,
    y
) {

    const lines =
        String(text)
            .split("\n");

    const lineHeight =
        17;

    const startY =
        y -
        (
            (
                lines.length - 1
            ) *
            lineHeight
        ) / 2;

    let svg =
        '<text ' +
            'class="mermaid-node-text" ' +
            'text-anchor="middle">';

    lines.forEach(
        (line, index) => {

            svg +=
                '<tspan ' +
                    'x="' +
                    x +
                    '" ' +
                    'y="' +
                    (
                        startY +
                        index *
                        lineHeight
                    ) +
                    '" ' +
                    'dominant-baseline="middle">' +

                    escapeSvgText(
                        line
                    ) +

                '</tspan>';
        }
    );

    svg +=
        "</text>";

    return svg;
}


/* =========================================================
   SVG Escape
========================================================= */

function escapeSvgText(
    value
) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}
