<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIPMS Analysis Viewer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f6f8;
    color: #24292f;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
}

/* =========================================================
   Header
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid #d8dee4;
}

.controls {
    width: 90%;
    max-width: 90%;
    margin: auto;
    padding: 10px 0;
}

.row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
}

label {
    min-width: 55px;
    font-weight: 600;
}

/* =========================================================
   Top Row
========================================================= */

.top-row {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
}

.top-row select {
    flex: 0 1 300px;
    min-width: 180px;
}

.top-row button {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* =========================================================
   Select / Button
========================================================= */

select,
button {
    padding: 8px 12px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: white;
    font: inherit;
}

select {
    min-width: 260px;
}

button {
    cursor: pointer;
}

button:hover:not(:disabled) {
    border-color: #0969da;
}

button.active {
    background: #ddf4ff;
    border-color: #54aeff;
    color: #0969da;
    font-weight: 600;
}

button:disabled {
    color: #afb8c1;
    cursor: default;
}

.main-tab {
    min-width: 80px;
    font-weight: 600;
}

/* =========================================================
   FE / API / BE
========================================================= */

.sub {
    display: none;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #d8dee4;
}

.sub.show {
    display: block;
}

/* =========================================================
   FE
========================================================= */

.fe-row {
    flex-wrap: nowrap;
    width: 100%;
}

.fe-scroll {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 6px;
}

#fes {
    display: flex;
    flex-wrap: nowrap;
    gap: 7px;
    width: max-content;
}

#fes button {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* =========================================================
   API / BE
========================================================= */

.backend-row {
    align-items: center;
    gap: 28px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 6px;
}

.backend-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
}

.backend-group label {
    min-width: auto;
    font-weight: 700;
}

.backend-buttons {
    display: flex;
    flex-wrap: nowrap;
    gap: 7px;
}

.backend-buttons button {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* =========================================================
   Scrollbar
========================================================= */

.fe-scroll::-webkit-scrollbar,
.backend-row::-webkit-scrollbar,
.top-row::-webkit-scrollbar,
.mermaid-scroll::-webkit-scrollbar {
    height: 7px;
}

.fe-scroll::-webkit-scrollbar-track,
.backend-row::-webkit-scrollbar-track,
.top-row::-webkit-scrollbar-track,
.mermaid-scroll::-webkit-scrollbar-track {
    background: #f1f3f5;
    border-radius: 5px;
}

.fe-scroll::-webkit-scrollbar-thumb,
.backend-row::-webkit-scrollbar-thumb,
.top-row::-webkit-scrollbar-thumb,
.mermaid-scroll::-webkit-scrollbar-thumb {
    background: #afb8c1;
    border-radius: 5px;
}

/* =========================================================
   Status
========================================================= */

.status {
    width: 90%;
    max-width: 90%;
    margin: 10px auto 0;
    color: #57606a;
    font-size: 12px;
}

/* =========================================================
   Viewer
========================================================= */

.viewer {
    width: 90%;
    max-width: 90%;
    margin: 12px auto 50px;
    min-height: 500px;
    padding: 32px 40px;
    background: white;
    border: 1px solid #d8dee4;
    border-radius: 8px;
    overflow-x: auto;
    line-height: 1.7;
}

/* =========================================================
   Markdown
========================================================= */

.viewer h1 {
    font-size: 28px;
    margin-top: 34px;
    padding-bottom: 10px;
    border-bottom: 1px solid #d8dee4;
}

.viewer h1:first-child {
    margin-top: 0;
}

.viewer h2 {
    font-size: 22px;
    margin-top: 30px;
    padding-bottom: 7px;
    border-bottom: 1px solid #d8dee4;
}

.viewer h3 {
    font-size: 18px;
    margin-top: 24px;
}

.viewer h4 {
    font-size: 16px;
    margin-top: 20px;
}

.viewer p {
    margin: 10px 0;
}

.viewer ul,
.viewer ol {
    padding-left: 28px;
}

.viewer li {
    margin: 4px 0;
}

.viewer blockquote {
    margin: 16px 0;
    padding: 4px 16px;
    color: #57606a;
    border-left: 4px solid #d0d7de;
    background: #f6f8fa;
}

.viewer hr {
    border: 0;
    border-top: 1px solid #d8dee4;
    margin: 24px 0;
}

/* =========================================================
   Code
========================================================= */

.viewer pre {
    background: #f6f8fa;
    border: 1px solid #d8dee4;
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    line-height: 1.5;
    font-family:
        Consolas,
        "Courier New",
        monospace;
    font-size: 13px;
    white-space: pre;
}

.viewer code {
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

.viewer :not(pre) > code {
    background: #eff1f3;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 90%;
}

/* =========================================================
   Table
========================================================= */

.viewer table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 24px;
    font-size: 13px;
}

.viewer th,
.viewer td {
    border: 1px solid #d0d7de;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
}

.viewer th {
    background: #f6f8fa;
    font-weight: 700;
}

.viewer tr:nth-child(even) td {
    background: #fbfcfd;
}

/* =========================================================
   Mermaid
========================================================= */

.mermaid-wrap {
    width: 100%;
    margin: 22px 0;
    padding: 12px 14px 18px;
    background: #ffffff;
    border: 1px solid #d8dee4;
    border-radius: 8px;

    /*
       바깥쪽 clipping 방지
    */
    overflow: visible;
}

/* =========================================================
   Mermaid Toolbar
========================================================= */

.mermaid-toolbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.mermaid-download-btn {
    padding: 6px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #ffffff;
    color: #24292f;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
}

.mermaid-download-btn:hover {
    border-color: #0969da;
    color: #0969da;
    background: #f6f8fa;
}

/* =========================================================
   Mermaid Scroll Area
========================================================= */

.mermaid-scroll {
    width: 100%;

    /*
       큰 차트는 가로 스크롤
    */
    overflow-x: auto;

    /*
       위/아래 텍스트가 잘리지 않도록
    */
    overflow-y: visible;

    /*
       Mermaid SVG 경계보다 추가 공간 확보
    */
    padding:
        30px
        35px
        35px
        35px;
}

/* =========================================================
   Mermaid Body
========================================================= */

.mermaid {
    display: block;
    width: 100%;
    min-width: max-content;
    text-align: center;
    overflow: visible;
}

/* =========================================================
   Mermaid SVG
========================================================= */

.mermaid svg {
    display: block;

    /*
       Mermaid viewBox 기준 크기 사용
    */
    width: auto !important;
    height: auto !important;

    /*
       부모 크기에 강제로 맞추지 않는다.
       큰 Flowchart는 스크롤로 본다.
    */
    max-width: none !important;

    margin: 0 auto;

    /*
       SVG 바깥쪽 텍스트 clipping 방지
    */
    overflow: visible !important;
}

/* =========================================================
   Mermaid foreignObject
========================================================= */

.mermaid foreignObject {
    overflow: visible !important;
}

/* =========================================================
   Mermaid Label
========================================================= */

.mermaid .label,
.mermaid .nodeLabel,
.mermaid .edgeLabel {
    overflow: visible !important;
}

/*
   Mermaid HTML Label 내부
*/

.mermaid .nodeLabel p,
.mermaid .edgeLabel p {
    margin: 0 !important;

    line-height: 1.45 !important;

    /*
       한글 긴 텍스트
    */
    white-space: normal !important;

    word-break: keep-all !important;

    overflow-wrap: anywhere !important;

    /*
       글자 잘림 방지
    */
    overflow: visible !important;
}

/*
   foreignObject 안쪽 div
*/

.mermaid foreignObject div {
    overflow: visible !important;
}

/*
   Node 내부 텍스트
*/

.mermaid .node text {
    overflow: visible !important;
}

/* =========================================================
   Mermaid Error
========================================================= */

.mermaid-error {
    margin: 16px 0;
    padding: 14px;
    border: 1px solid #cf222e;
    border-radius: 6px;
    background: #ffebe9;
    color: #82071e;
    white-space: pre-wrap;
}

/* =========================================================
   Empty
========================================================= */

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #57606a;
}

/* =========================================================
   Mobile
========================================================= */

@media (max-width: 800px) {

    .controls,
    .viewer,
    .status {
        width: 96%;
        max-width: 96%;
    }

    .viewer {
        padding: 22px 18px;
    }

    .top-row select {
        min-width: 160px;
    }

    .mermaid-scroll {
        padding: 20px;
    }
}

</style>
</head>

<body>

<header>

<div class="controls">

    <!-- =====================================================
         TOP
    ====================================================== -->

    <div class="row top-row">

        <label>화면명</label>

        <select id="screen">

            <option value="">
                화면 선택
            </option>

        </select>

        <button id="pick">
            docs/analysis 선택
        </button>

        <button
            id="screenTab"
            class="main-tab"
            disabled
        >
            SCREEN
        </button>

        <button
            id="feTab"
            class="main-tab"
            disabled
        >
            FE
        </button>

    </div>

    <!-- =====================================================
         SUB
    ====================================================== -->

    <div
        id="sub"
        class="sub"
    >

        <!-- FE -->

        <div class="row fe-row">

            <label>FE</label>

            <div class="fe-scroll">

                <div id="fes"></div>

            </div>

        </div>

        <!-- API / BE -->

        <div
            id="backendRow"
            class="backend-row"
            style="display:none"
        >

            <!-- API -->

            <div
                id="apiRow"
                class="backend-group"
                style="display:none"
            >

                <label>API</label>

                <div
                    id="apis"
                    class="backend-buttons"
                ></div>

            </div>

            <!-- BE -->

            <div
                id="beRow"
                class="backend-group"
                style="display:none"
            >

                <label>BE</label>

                <div
                    id="bes"
                    class="backend-buttons"
                ></div>

            </div>

        </div>

    </div>

</div>

</header>

<!-- =========================================================
     Status
========================================================= -->

<div
    id="status"
    class="status"
>
    Chrome/Edge에서
    <b>docs/analysis 선택</b>
    버튼으로 분석 폴더를 선택하세요.
</div>

<!-- =========================================================
     Viewer
========================================================= -->

<main
    id="viewer"
    class="viewer"
>

    <div class="empty">
        문서를 선택하면 여기에 표시됩니다.
    </div>

</main>

<!-- =========================================================
     LOCAL MERMAID

     같은 폴더:

     analysis-viewer.html
     mermaid.min.js
========================================================= -->

<script src="./mermaid.min.js"></script>

<script>

/* =========================================================
   State
========================================================= */

const q =
    selector =>
        document.querySelector(
            selector
        );

let root = null;

let data =
    new Map();

let screenName = "";

let action = "";

let mermaidSequence = 0;


/* =========================================================
   Mermaid Init
========================================================= */

if (
    typeof mermaid !==
    "undefined"
) {

    mermaid.initialize({

        startOnLoad: false,

        securityLevel: "loose",

        theme: "default",

        flowchart: {

            /*
               긴 한글 텍스트 처리에 유리
            */

            htmlLabels: true,


            /*
               Mermaid 자체 viewBox와
               responsive 계산 사용
            */

            useMaxWidth: true,


            /*
               노드 사이 간격
            */

            nodeSpacing: 50,


            /*
               단계 사이 간격
            */

            rankSpacing: 60,


            /*
               Flowchart 내부 여백
            */

            padding: 20
        }

    });

}
else {

    console.error(
        "mermaid.min.js를 불러오지 못했습니다."
    );
}


/* =========================================================
   Escape
========================================================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );
}


/* =========================================================
   Directory
========================================================= */

async function dir(
    handle,
    name
) {

    try {

        return await handle
            .getDirectoryHandle(
                name
            );

    }
    catch {

        return null;
    }
}


async function file(
    handle,
    name
) {

    try {

        return await handle
            .getFileHandle(
                name
            );

    }
    catch {

        return null;
    }
}


async function mds(
    handle
) {

    const result = [];

    if (!handle) {

        return result;
    }

    for await (
        const [name, item]
        of handle.entries()
    ) {

        if (
            item.kind === "file" &&
            name
                .toLowerCase()
                .endsWith(".md")
        ) {

            result.push(
                item
            );
        }
    }


    return result.sort(
        (a, b) =>

            a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );
}


/* =========================================================
   Filename
========================================================= */

function act(
    name
) {

    const match =
        name.match(
            /^FE-(ACT-\d+)/i
        );


    return match
        ? match[1].toUpperCase()
        : "";
}


function feLabel(
    name
) {

    const match =
        name.match(
            /^FE-(ACT-\d+)-(.+)\.md$/i
        );


    if (!match) {

        return name.replace(
            /\.md$/i,
            ""
        );
    }


    return (
        match[1] +
        " " +
        match[2]
            .replaceAll(
                "-",
                " "
            )
    );
}


function child(
    name,
    actionId,
    type
) {

    const upper =
        name.toUpperCase();


    return (

        upper.startsWith(
            "FE-" +
            actionId +
            "-"
        )

        &&

        upper.includes(
            "-" +
            type +
            "-"
        )
    );
}


function childLabel(
    name,
    type
) {

    const regex =
        new RegExp(
            "-(" +
            type +
            "-\\d+)\\.md$",
            "i"
        );


    const match =
        name.match(
            regex
        );


    return match
        ? match[1].toUpperCase()
        : name.replace(
            /\.md$/i,
            ""
        );
}


/* =========================================================
   Main Active
========================================================= */

function setMainActive(
    button
) {

    q("#screenTab")
        .classList
        .remove(
            "active"
        );


    q("#feTab")
        .classList
        .remove(
            "active"
        );


    if (button) {

        button
            .classList
            .add(
                "active"
            );
    }
}


/* =========================================================
   Render File
========================================================= */

async function renderFile(
    handle
) {

    if (!handle) {

        return;
    }


    try {

        const target =
            await handle.getFile();


        const markdown =
            await target.text();


        await renderMarkdown(
            markdown
        );


        q("#status")
            .innerHTML =

            "표시 문서: <b>" +

            escapeHtml(
                handle.name
            )

            + "</b>";

    }
    catch (error) {

        console.error(
            error
        );


        q("#viewer")
            .innerHTML =

            '<div class="empty">' +

            '문서를 읽을 수 없습니다.<br>' +

            escapeHtml(
                error.message
            )

            + '</div>';
    }
}


/* =========================================================
   Scan
========================================================= */

async function scan() {

    data.clear();


    for await (
        const [name, handle]
        of root.entries()
    ) {

        if (
            handle.kind !==
            "directory"
        ) {

            continue;
        }


        const screen =
            await file(
                handle,
                "SCREEN-" +
                name +
                ".md"
            );


        const frontend =
            await dir(
                handle,
                "frontend"
            );


        const api =
            await dir(
                handle,
                "api"
            );


        const backend =
            await dir(
                handle,
                "backend"
            );


        if (
            screen ||
            frontend ||
            api ||
            backend
        ) {

            data.set(
                name,
                {
                    screen,
                    frontend,
                    api,
                    backend
                }
            );
        }
    }


    const select =
        q("#screen");


    select.innerHTML =
        '<option value="">' +
        '화면 선택' +
        '</option>';


    [...data.keys()]

        .sort(
            (a, b) =>

                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        )

        .forEach(
            name => {

                select.add(
                    new Option(
                        name,
                        name
                    )
                );
            }
        );


    q("#status")
        .textContent =

        data.size +
        "개 화면을 찾았습니다.";
}


/* =========================================================
   Folder Picker
========================================================= */

q("#pick")
    .onclick =
async () => {

    if (
        !window
            .showDirectoryPicker
    ) {

        alert(
            "현재 브라우저에서는 폴더 선택 기능을 지원하지 않습니다.\n\n" +
            "Chrome 또는 Edge 최신 버전에서 실행해 주세요."
        );


        return;
    }


    try {

        root =
            await window
                .showDirectoryPicker({
                    mode: "read"
                });


        await scan();

    }
    catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                error
            );
        }
    }
};


/* =========================================================
   Screen Change
========================================================= */

q("#screen")
    .onchange =
async event => {

    screenName =
        event.target.value;


    action = "";


    q("#sub")
        .classList
        .remove(
            "show"
        );


    q("#backendRow")
        .style.display =
        "none";


    q("#screenTab")
        .disabled =
        !screenName;


    q("#feTab")
        .disabled =
        !screenName;


    if (!screenName) {

        return;
    }


    await showScreen();
};


/* =========================================================
   SCREEN
========================================================= */

async function showScreen() {

    const current =
        data.get(
            screenName
        );


    if (!current) {

        return;
    }


    q("#sub")
        .classList
        .remove(
            "show"
        );


    q("#backendRow")
        .style.display =
        "none";


    setMainActive(
        q("#screenTab")
    );


    if (
        current.screen
    ) {

        await renderFile(
            current.screen
        );

    }
    else {

        q("#viewer")
            .innerHTML =

            '<div class="empty">' +
            'SCREEN 문서가 없습니다.' +
            '</div>';
    }
}


q("#screenTab")
    .onclick =
    showScreen;


/* =========================================================
   FE
========================================================= */

q("#feTab")
    .onclick =
async () => {

    const current =
        data.get(
            screenName
        );


    if (!current) {

        return;
    }


    setMainActive(
        q("#feTab")
    );


    q("#sub")
        .classList
        .add(
            "show"
        );


    q("#fes")
        .innerHTML = "";


    q("#apis")
        .innerHTML = "";


    q("#bes")
        .innerHTML = "";


    q("#apiRow")
        .style.display =
        "none";


    q("#beRow")
        .style.display =
        "none";


    q("#backendRow")
        .style.display =
        "none";


    const frontendFiles =
        await mds(
            current.frontend
        );


    if (
        !frontendFiles.length
    ) {

        q("#fes")
            .textContent =
            "FE 문서 없음";


        q("#viewer")
            .innerHTML =

            '<div class="empty">' +
            '이 화면에는 FE 문서가 없습니다.' +
            '</div>';


        return;
    }


    frontendFiles.forEach(
        handle => {

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                feLabel(
                    handle.name
                );


            button.title =
                handle.name;


            button.onclick =
                () =>

                    selectFE(
                        handle,
                        button
                    );


            q("#fes")
                .appendChild(
                    button
                );
        }
    );


    q("#viewer")
        .innerHTML =

        '<div class="empty">' +
        'FE 기능을 선택하세요.' +
        '</div>';
};


/* =========================================================
   Select FE
========================================================= */

async function selectFE(
    handle,
    button
) {

    action =
        act(
            handle.name
        );


    document
        .querySelectorAll(
            "#fes button"
        )
        .forEach(
            item =>

                item.classList
                    .remove(
                        "active"
                    )
        );


    button
        .classList
        .add(
            "active"
        );


    setMainActive(
        q("#feTab")
    );


    await renderFile(
        handle
    );


    const current =
        data.get(
            screenName
        );


    const apiFiles =
        (
            await mds(
                current.api
            )
        )
        .filter(
            item =>

                child(
                    item.name,
                    action,
                    "API"
                )
        );


    const backendFiles =
        (
            await mds(
                current.backend
            )
        )
        .filter(
            item =>

                child(
                    item.name,
                    action,
                    "BE"
                )
        );


    fillChildren(
        "#apis",
        "#apiRow",
        apiFiles,
        "API"
    );


    fillChildren(
        "#bes",
        "#beRow",
        backendFiles,
        "BE"
    );


    if (
        apiFiles.length ||
        backendFiles.length
    ) {

        q("#backendRow")

        q("#backendRow")
            .style.display =
            "none";
    }
}

/* =========================================================
   Mermaid Render
========================================================= */

async function renderMermaidBlocks() {

    const blocks =
        document.querySelectorAll(
            "#viewer .mermaid"
        );


    if (
        blocks.length === 0
    ) {

        return;
    }


    if (
        typeof mermaid ===
        "undefined"
    ) {

        blocks.forEach(
            block => {

                const source =
                    block.textContent;


                const wrap =
                    block.closest(
                        ".mermaid-wrap"
                    );


                if (wrap) {

                    wrap.innerHTML =

                        '<div class="mermaid-error">' +

                        '<b>Mermaid를 불러오지 못했습니다.</b>\n\n' +

                        'analysis-viewer.html과 mermaid.min.js가 같은 폴더에 있는지 확인하세요.\n\n' +

                        escapeHtml(
                            source
                        ) +

                        '</div>';
                }
            }
        );


        return;
    }


    for (
        const block
        of blocks
    ) {

        const source =
            block.textContent;


        mermaidSequence++;


        const id =
            "mermaid-svg-" +
            mermaidSequence;


        try {

            /* =============================================
               Mermaid 11 Render
            ============================================= */

            const result =
                await mermaid.render(
                    id,
                    source
                );


            block.innerHTML =
                result.svg;


            if (
                result.bindFunctions
            ) {

                result.bindFunctions(
                    block
                );
            }


            /* =============================================
               SVG 후처리
            ============================================= */

            const svg =
                block.querySelector(
                    "svg"
                );


            if (svg) {

                /*
                   Mermaid가 max-width를 inline style로
                   넣는 경우 제거
                */

                svg.style.maxWidth =
                    "none";


                svg.style.overflow =
                    "visible";


                /*
                   viewBox가 있으면 그대로 사용
                */

                const viewBox =
                    svg.getAttribute(
                        "viewBox"
                    );


                if (viewBox) {

                    const values =
                        viewBox
                            .trim()
                            .split(/\s+/)
                            .map(Number);


                    if (
                        values.length === 4 &&
                        values.every(
                            Number.isFinite
                        )
                    ) {

                        const width =
                            values[2];


                        const height =
                            values[3];


                        /*
                           실제 SVG 크기 설정

                           큰 차트는 축소하지 않고
                           가로 스크롤로 표시
                        */

                        if (
                            width > 0
                        ) {

                            svg.setAttribute(
                                "width",
                                width
                            );
                        }


                        if (
                            height > 0
                        ) {

                            svg.setAttribute(
                                "height",
                                height
                            );
                        }
                    }
                }
            }


            /* =============================================
               Toolbar
            ============================================= */

            const wrap =
                block.closest(
                    ".mermaid-wrap"
                );


            if (wrap) {

                const toolbar =
                    document.createElement(
                        "div"
                    );


                toolbar.className =
                    "mermaid-toolbar";


                const downloadButton =
                    document.createElement(
                        "button"
                    );


                downloadButton.type =
                    "button";


                downloadButton.className =
                    "mermaid-download-btn";


                downloadButton.textContent =
                    "SVG 다운로드";


                downloadButton.title =
                    "현재 Flowchart를 SVG 파일로 저장";


                downloadButton.onclick =
                    () => {

                        downloadMermaidSvg(
                            block,
                            id
                        );
                    };


                toolbar.appendChild(
                    downloadButton
                );


                const scroll =
                    block.closest(
                        ".mermaid-scroll"
                    );


                if (scroll) {

                    wrap.insertBefore(
                        toolbar,
                        scroll
                    );

                }
                else {

                    wrap.insertBefore(
                        toolbar,
                        block
                    );
                }
            }

        }
        catch (error) {

            console.error(
                "Mermaid Render Error:",
                error
            );


            const wrap =
                block.closest(
                    ".mermaid-wrap"
                );


            const errorHtml =

                '<div class="mermaid-error">' +

                '<b>Mermaid Flowchart 오류</b>\n\n' +

                escapeHtml(
                    error.message ||
                    String(error)
                ) +

                '\n\n--- Mermaid Source ---\n' +

                escapeHtml(
                    source
                ) +

                '</div>';


            if (wrap) {

                wrap.innerHTML =
                    errorHtml;

            }
            else {

                block.innerHTML =
                    errorHtml;
            }
        }
    }
}


/* =========================================================
   SVG Download
========================================================= */

function downloadMermaidSvg(
    block,
    id
) {

    const svg =
        block.querySelector(
            "svg"
        );


    if (!svg) {

        alert(
            "다운로드할 SVG를 찾을 수 없습니다."
        );


        return;
    }


    /*
       화면 SVG 복사
    */

    const clone =
        svg.cloneNode(
            true
        );


    /* =====================================================
       Namespace
    ===================================================== */

    clone.setAttribute(
        "xmlns",
        "http://www.w3.org/2000/svg"
    );


    clone.setAttribute(
        "xmlns:xlink",
        "http://www.w3.org/1999/xlink"
    );


    /* =====================================================
       SVG Overflow
    ===================================================== */

    clone.setAttribute(
        "overflow",
        "visible"
    );


    clone.style.overflow =
        "visible";


    clone.style.maxWidth =
        "none";


    /* =====================================================
       ViewBox 여백 추가
    ===================================================== */

    const viewBox =
        clone.getAttribute(
            "viewBox"
        );


    if (viewBox) {

        const values =
            viewBox
                .trim()
                .split(/\s+/)
                .map(Number);


        if (
            values.length === 4 &&
            values.every(
                Number.isFinite
            )
        ) {

            const x =
                values[0];


            const y =
                values[1];


            const width =
                values[2];


            const height =
                values[3];


            /*
               다운로드 SVG에
               상하좌우 40px 추가
            */

            const padding =
                40;


            const newX =
                x -
                padding;


            const newY =
                y -
                padding;


            const newWidth =
                width +
                (
                    padding *
                    2
                );


            const newHeight =
                height +
                (
                    padding *
                    2
                );


            clone.setAttribute(
                "viewBox",

                [
                    newX,
                    newY,
                    newWidth,
                    newHeight
                ].join(
                    " "
                )
            );


            clone.setAttribute(
                "width",
                newWidth
            );


            clone.setAttribute(
                "height",
                newHeight
            );
        }
    }


    /* =====================================================
       흰색 배경

       PowerPoint / Word / 브라우저 등에서
       보기 편하도록 SVG 첫 번째 요소에
       흰색 배경 추가
    ===================================================== */

    const viewBoxAfter =
        clone.getAttribute(
            "viewBox"
        );


    if (viewBoxAfter) {

        const values =
            viewBoxAfter
                .trim()
                .split(/\s+/)
                .map(Number);


        if (
            values.length === 4 &&
            values.every(
                Number.isFinite
            )
        ) {

            const background =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );


            background.setAttribute(
                "x",
                values[0]
            );


            background.setAttribute(
                "y",
                values[1]
            );


            background.setAttribute(
                "width",
                values[2]
            );


            background.setAttribute(
                "height",
                values[3]
            );


            background.setAttribute(
                "fill",
                "white"
            );


            clone.insertBefore(
                background,
                clone.firstChild
            );
        }
    }


    /* =====================================================
       Serialize
    ===================================================== */

    const serializer =
        new XMLSerializer();


    let svgSource =
        serializer.serializeToString(
            clone
        );


    svgSource =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        svgSource;


    /* =====================================================
       Blob
    ===================================================== */

    const blob =
        new Blob(
            [
                svgSource
            ],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    /* =====================================================
       Download
    ===================================================== */

    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        createSvgFilename(
            id
        );


    document.body
        .appendChild(
            link
        );


    link.click();


    document.body
        .removeChild(
            link
        );


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );
}


/* =========================================================
   SVG Filename
========================================================= */

function createSvgFilename(
    id
) {

    let filename =
        "flowchart";


    const status =
        q("#status");


    if (status) {

        let text =
            status
                .textContent
                .replace(
                    "표시 문서:",
                    ""
                )
                .trim();


        if (text) {

            text =
                text.replace(
                    /\.md$/i,
                    ""
                );


            /*
               Windows 금지 문자 제거
            */

            text =
                text.replace(
                    /[\\/:*?"<>|]/g,
                    "_"
                );


            filename =
                text;
        }
    }


    return (
        filename +
        "-" +
        id +
        ".svg"
    );
}


/* =========================================================
   Markdown → HTML
========================================================= */

function markdownToHtml(
    markdown
) {

    markdown =
        markdown.replace(
            /\r\n/g,
            "\n"
        );


    const lines =
        markdown.split(
            "\n"
        );


    let html = "";

    let index = 0;

    let inCode = false;

    let codeLanguage = "";

    let codeBuffer = [];

    let listType = null;


    while (
        index <
        lines.length
    ) {

        const line =
            lines[index];


        /* =================================================
           Code Fence
        ================================================= */

        if (
            line
                .trim()
                .startsWith(
                    "```"
                )
        ) {

            closeList();


            if (
                !inCode
            ) {

                inCode =
                    true;


                codeLanguage =
                    line
                        .trim()
                        .substring(3)
                        .trim()
                        .toLowerCase();


                codeBuffer =
                    [];

            }
            else {

                /* =========================================
                   Mermaid
                ========================================= */

                if (
                    codeLanguage ===
                    "mermaid"
                ) {

                    html +=

                        '<div class="mermaid-wrap">' +

                            '<div class="mermaid-scroll">' +

                                '<div class="mermaid">' +

                                    escapeHtml(
                                        codeBuffer.join(
                                            "\n"
                                        )
                                    ) +

                                '</div>' +

                            '</div>' +

                        '</div>';
                }
                else {

                    /* =====================================
                       일반 Code
                    ===================================== */

                    html +=

                        "<pre><code" +

                        (
                            codeLanguage

                                ? ' class="language-' +

                                  escapeAttribute(
                                      codeLanguage
                                  ) +

                                  '"'

                                : ""
                        )

                        + ">" +

                        escapeHtml(
                            codeBuffer.join(
                                "\n"
                            )
                        )

                        + "</code></pre>";
                }


                inCode =
                    false;


                codeLanguage =
                    "";


                codeBuffer =
                    [];
            }


            index++;


            continue;
        }


        /* =================================================
           Code 내용
        ================================================= */

        if (
            inCode
        ) {

            codeBuffer.push(
                line
            );


            index++;


            continue;
        }


        /* =================================================
           Table
        ================================================= */

        if (
            isTableHeader(
                lines,
                index
            )
        ) {

            closeList();


            const result =
                parseTable(
                    lines,
                    index
                );


            html +=
                result.html;


            index =
                result.nextIndex;


            continue;
        }


        /* =================================================
           Blank
        ================================================= */

        if (
            line.trim() ===
            ""
        ) {

            closeList();


            index++;


            continue;
        }


        /* =================================================
           HR
        ================================================= */

        if (
            /^(\s*)(---|\*\*\*|___)(\s*)$/
                .test(
                    line
                )
        ) {

            closeList();


            html +=
                "<hr>";


            index++;


            continue;
        }


        /* =================================================
           Heading
        ================================================= */

        const headingMatch =
            line.match(
                /^(#{1,6})\s+(.+)$/
            );


        if (
            headingMatch
        ) {

            closeList();


            const level =
                headingMatch[1]
                    .length;


            html +=

                "<h" +
                level +
                ">" +

                inlineMarkdown(
                    headingMatch[2]
                ) +

                "</h" +
                level +
                ">";


            index++;


            continue;
        }


        /* =================================================
           Blockquote
        ================================================= */

        if (
            line
                .trimStart()
                .startsWith(
                    ">"
                )
        ) {

            closeList();


            const quoteLines =
                [];


            while (
                index <
                    lines.length

                &&

                lines[index]
                    .trimStart()
                    .startsWith(
                        ">"
                    )
            ) {

                quoteLines.push(

                    lines[index]
                        .trimStart()
                        .replace(
                            /^>\s?/,
                            ""
                        )
                );


                index++;
            }


            html +=

                "<blockquote>" +

                quoteLines
                    .map(
                        item =>

                            item.trim()

                                ? inlineMarkdown(
                                    item
                                )

                                : "<br>"
                    )
                    .join(
                        "<br>"
                    )

                + "</blockquote>";


            continue;
        }


        /* =================================================
           UL
        ================================================= */

        const ulMatch =
            line.match(
                /^\s*[-*+]\s+(.+)$/
            );


        if (
            ulMatch
        ) {

            if (
                listType !==
                "ul"
            ) {

                closeList();


                html +=
                    "<ul>";


                listType =
                    "ul";
            }


            html +=

                "<li>" +

                inlineMarkdown(
                    ulMatch[1]
                )

                + "</li>";


            index++;


            continue;
        }


        /* =================================================
           OL
        ================================================= */

        const olMatch =
            line.match(
                /^\s*\d+\.\s+(.+)$/
            );


        if (
            olMatch
        ) {

            if (
                listType !==
                "ol"
            ) {

                closeList();


                html +=
                    "<ol>";


                listType =
                    "ol";
            }


            html +=

                "<li>" +

                inlineMarkdown(
                    olMatch[1]
                )

                + "</li>";


            index++;


            continue;
        }


        /* =================================================
           Paragraph
        ================================================= */

        closeList();


        const paragraphLines =
            [
                line
            ];


        index++;


        while (
            index <
            lines.length
        ) {

            const next =
                lines[index];


            if (
                next.trim() ===
                    ""

                ||

                next
                    .trim()
                    .startsWith(
                        "```"
                    )

                ||

                /^#{1,6}\s+/
                    .test(
                        next
                    )

                ||

                /^(\s*)(---|\*\*\*|___)(\s*)$/
                    .test(
                        next
                    )

                ||

                next
                    .trimStart()
                    .startsWith(
                        ">"
                    )

                ||

                /^\s*[-*+]\s+/
                    .test(
                        next
                    )

                ||

                /^\s*\d+\.\s+/
                    .test(
                        next
                    )

                ||

                isTableHeader(
                    lines,
                    index
                )
            ) {

                break;
            }


            paragraphLines.push(
                next
            );


            index++;
        }


        html +=

            "<p>" +

            paragraphLines
                .map(
                    item =>

                        inlineMarkdown(
                            item
                        )
                )
                .join(
                    "<br>"
                )

            + "</p>";
    }


    /* =====================================================
       닫히지 않은 Code Block
    ===================================================== */

    if (
        inCode
    ) {

        if (
            codeLanguage ===
            "mermaid"
        ) {

            html +=

                '<div class="mermaid-wrap">' +

                    '<div class="mermaid-scroll">' +

                        '<div class="mermaid">' +

                            escapeHtml(
                                codeBuffer.join(
                                    "\n"
                                )
                            ) +

                        '</div>' +

                    '</div>' +

                '</div>';

        }
        else {

            html +=

                "<pre><code>" +

                escapeHtml(
                    codeBuffer.join(
                        "\n"
                    )
                )

                + "</code></pre>";
        }
    }


    closeList();


    return html;


    function closeList() {

        if (
            listType ===
            "ul"
        ) {

            html +=
                "</ul>";
        }


        if (
            listType ===
            "ol"
        ) {

            html +=
                "</ol>";
        }


        listType =
            null;
    }
}


/* =========================================================
   Table Detection
========================================================= */

function isTableHeader(
    lines,
    index
) {

    if (
        index + 1 >=
        lines.length
    ) {

        return false;
    }


    const first =
        lines[index]
            .trim();


    const second =
        lines[index + 1]
            .trim();


    if (
        !first.includes(
            "|"
        )
    ) {

        return false;
    }


    if (
        !second.includes(
            "|"
        )
    ) {

        return false;
    }


    const cells =
        splitTableRow(
            second
        );


    if (
        cells.length ===
        0
    ) {

        return false;
    }


    return cells.every(
        cell =>

            /^:?-{3,}:?$/
                .test(
                    cell.trim()
                )
    );
}


/* =========================================================
   Table
========================================================= */

function parseTable(
    lines,
    startIndex
) {

    const headers =
        splitTableRow(
            lines[
                startIndex
            ]
        );


    let index =
        startIndex + 2;


    const rows =
        [];


    while (
        index <
        lines.length
    ) {

        const line =
            lines[index]
                .trim();


        if (
            line ===
                ""

            ||

            !line.includes(
                "|"
            )
        ) {

            break;
        }


        rows.push(
            splitTableRow(
                line
            )
        );


        index++;
    }


    let html =
        "<table><thead><tr>";


    for (
        const header
        of headers
    ) {

        html +=

            "<th>" +

            inlineMarkdown(
                header.trim()
            )

            + "</th>";
    }


    html +=
        "</tr></thead><tbody>";


    for (
        const row
        of rows
    ) {

        html +=
            "<tr>";


        for (
            let column = 0;
            column <
                headers.length;
            column++
        ) {

            const value =
                row[column] ??
                "";


            html +=

                "<td>" +

                inlineMarkdown(
                    value.trim()
                )

                + "</td>";
        }


        html +=
            "</tr>";
    }


    html +=
        "</tbody></table>";


    return {

        html:
            html,

        nextIndex:
            index
    };
}


/* =========================================================
   Split Table Row
========================================================= */

function splitTableRow(
    line
) {

    let value =
        line.trim();


    if (
        value.startsWith(
            "|"
        )
    ) {

        value =
            value.substring(
                1
            );
    }


    if (
        value.endsWith(
            "|"
        )
    ) {

        value =
            value.substring(
                0,
                value.length - 1
            );
    }


    return value.split(
        "|"
    );
}


/* =========================================================
   Inline Markdown
========================================================= */

function inlineMarkdown(
    text
) {

    let value =
        escapeHtml(
            text
        );


    /* =====================================================
       Inline Code
    ===================================================== */

    value =
        value.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    /* =====================================================
       Bold
    ===================================================== */

    value =
        value.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    /* =====================================================
       Italic

       lookbehind 사용 안 함
    ===================================================== */

    value =
        value.replace(
            /(^|[^*])\*([^*]+)\*/g,
            "$1<em>$2</em>"
        );


    return value;
}

</script>

</body>
