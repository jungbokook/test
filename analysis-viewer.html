<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIPMS Analysis Viewer</title>

<style>

/* =========================================================
   Base
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f6f8;
    color: #24292f;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
}


/* =========================================================
   Header
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 10;

    background: #ffffff;
    border-bottom: 1px solid #d8dee4;
}

.controls {
    width: 90%;
    max-width: 90%;
    margin: auto;

    padding: 16px 0;
}


/* =========================================================
   Common Row
========================================================= */

.row {
    display: flex;
    align-items: center;
    gap: 10px;

    flex-wrap: wrap;

    margin: 8px 0;
}

.row label {
    min-width: 55px;

    font-weight: 600;
}


/* =========================================================
   Select / Button
========================================================= */

select,
button {
    padding: 8px 13px;

    border: 1px solid #d0d7de;
    border-radius: 6px;

    background: white;

    font: inherit;
}

select {
    min-width: 260px;
}

button {
    cursor: pointer;
}

button:hover {
    border-color: #0969da;
}

button.active {
    background: #ddf4ff;
    border-color: #54aeff;

    color: #0969da;

    font-weight: 600;
}

button:disabled {
    color: #afb8c1;
    cursor: default;
}


/* =========================================================
   Main Tabs
========================================================= */

.main-tabs {
    display: flex;
    gap: 6px;

    margin-top: 12px;
}

.main-tab {
    min-width: 90px;

    font-weight: 600;
}


/* =========================================================
   FE / API / BE Area
========================================================= */

.sub {
    display: none;

    margin-top: 12px;
    padding-top: 8px;

    border-top: 1px solid #d8dee4;
}

.sub.show {
    display: block;
}


/* =========================================================
   FE Horizontal Scroll
========================================================= */

.fe-row {
    display: flex;

    flex-wrap: nowrap;

    align-items: center;

    width: 100%;
}

.fe-scroll {
    flex: 1;

    min-width: 0;

    overflow-x: auto;
    overflow-y: hidden;

    padding-bottom: 7px;
}

#fes {
    display: flex;

    flex-wrap: nowrap;

    gap: 7px;

    width: max-content;
}

#fes button {
    flex: 0 0 auto;

    white-space: nowrap;
}


/* scrollbar */

.fe-scroll::-webkit-scrollbar {
    height: 7px;
}

.fe-scroll::-webkit-scrollbar-track {
    background: #f1f3f5;

    border-radius: 5px;
}

.fe-scroll::-webkit-scrollbar-thumb {
    background: #afb8c1;

    border-radius: 5px;
}

.fe-scroll::-webkit-scrollbar-thumb:hover {
    background: #8c959f;
}


/* =========================================================
   API / BE
========================================================= */

#apis,
#bes {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}


/* =========================================================
   Document Info
========================================================= */

.status {
    width: 90%;
    max-width: 90%;

    margin: 14px auto 0;

    color: #57606a;

    font-size: 12px;
}


/* =========================================================
   Viewer
========================================================= */

.viewer {
    width: 90%;
    max-width: 90%;

    margin: 16px auto 50px;

    min-height: 500px;

    padding: 36px 44px;

    background: white;

    border: 1px solid #d8dee4;

    border-radius: 8px;

    overflow-x: auto;

    line-height: 1.7;
}


/* =========================================================
   Markdown Heading
========================================================= */

.viewer h1 {
    font-size: 28px;

    margin-top: 34px;

    padding-bottom: 10px;

    border-bottom: 1px solid #d8dee4;
}

.viewer h1:first-child {
    margin-top: 0;
}

.viewer h2 {
    font-size: 22px;

    margin-top: 30px;

    padding-bottom: 7px;

    border-bottom: 1px solid #d8dee4;
}

.viewer h3 {
    font-size: 18px;

    margin-top: 24px;
}

.viewer h4 {
    font-size: 16px;

    margin-top: 20px;
}


/* =========================================================
   Paragraph
========================================================= */

.viewer p {
    margin: 10px 0;
}


/* =========================================================
   List
========================================================= */

.viewer ul,
.viewer ol {
    padding-left: 28px;
}

.viewer li {
    margin: 4px 0;
}


/* =========================================================
   Blockquote
========================================================= */

.viewer blockquote {
    margin: 16px 0;

    padding: 4px 16px;

    color: #57606a;

    border-left: 4px solid #d0d7de;

    background: #f6f8fa;
}


/* =========================================================
   Code / Tree
========================================================= */

.viewer pre {
    background: #f6f8fa;

    border: 1px solid #d8dee4;

    border-radius: 6px;

    padding: 16px;

    overflow-x: auto;

    line-height: 1.5;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;

    white-space: pre;
}

.viewer code {
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

.viewer :not(pre) > code {
    background: #eff1f3;

    padding: 2px 5px;

    border-radius: 4px;

    font-size: 90%;
}


/* =========================================================
   Markdown Table
========================================================= */

.viewer table {
    width: 100%;

    border-collapse: collapse;

    margin: 16px 0 24px;

    font-size: 13px;
}

.viewer th,
.viewer td {
    border: 1px solid #d0d7de;

    padding: 8px 10px;

    text-align: left;

    vertical-align: top;
}

.viewer th {
    background: #f6f8fa;

    font-weight: 700;
}

.viewer tr:nth-child(even) td {
    background: #fbfcfd;
}


/* =========================================================
   HR
========================================================= */

.viewer hr {
    border: 0;

    border-top: 1px solid #d8dee4;

    margin: 24px 0;
}


/* =========================================================
   Empty
========================================================= */

.empty {
    padding: 60px 20px;

    text-align: center;

    color: #57606a;
}


/* =========================================================
   Mobile
========================================================= */

@media (max-width: 800px) {

    .controls,
    .viewer,
    .status {
        width: 96%;
        max-width: 96%;
    }

    .viewer {
        padding: 22px 18px;
    }

    select {
        width: 100%;
        min-width: 0;
    }
}

</style>
</head>


<body>


<header>

<div class="controls">


    <!-- =====================================================
         Screen Select
    ====================================================== -->

    <div class="row">

        <label>
            화면명
        </label>

        <select id="screen">

            <option value="">
                화면 선택
            </option>

        </select>


        <button id="pick">
            docs/analysis 선택
        </button>

    </div>


    <!-- =====================================================
         SCREEN / FE
    ====================================================== -->

    <div class="main-tabs">

        <button
            id="screenTab"
            class="main-tab"
            disabled
        >
            SCREEN
        </button>

        <button
            id="feTab"
            class="main-tab"
            disabled
        >
            FE
        </button>

    </div>


    <!-- =====================================================
         FE / API / BE
    ====================================================== -->

    <div
        id="sub"
        class="sub"
    >


        <!-- FE -->

        <div class="row fe-row">

            <label>
                FE
            </label>


            <div class="fe-scroll">

                <div id="fes"></div>

            </div>

        </div>


        <!-- API -->

        <div
            id="apiRow"
            class="row"
            style="display:none"
        >

            <label>
                API
            </label>

            <div id="apis"></div>

        </div>


        <!-- BE -->

        <div
            id="beRow"
            class="row"
            style="display:none"
        >

            <label>
                BE
            </label>

            <div id="bes"></div>

        </div>


    </div>

</div>

</header>


<!-- =========================================================
     Status
========================================================= -->

<div
    id="status"
    class="status"
>
    Chrome/Edge에서
    <b>docs/analysis 선택</b>
    버튼으로 분석 폴더를 선택하세요.
</div>


<!-- =========================================================
     Viewer
========================================================= -->

<main
    id="viewer"
    class="viewer"
>

    <div class="empty">

        문서를 선택하면
        여기에 표시됩니다.

    </div>

</main>



<script>

/* =========================================================
   State
========================================================= */

const q =
    selector =>
        document.querySelector(
            selector
        );


let root = null;

let data =
    new Map();


let screenName = "";

let action = "";


/* =========================================================
   Escape
========================================================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );
}


/* =========================================================
   Directory Helper
========================================================= */

async function dir(
    handle,
    name
) {

    try {

        return await handle
            .getDirectoryHandle(
                name
            );
    }
    catch {

        return null;
    }
}


async function file(
    handle,
    name
) {

    try {

        return await handle
            .getFileHandle(
                name
            );
    }
    catch {

        return null;
    }
}


/* =========================================================
   Markdown Files
========================================================= */

async function mds(
    handle
) {

    const result = [];


    if (!handle) {

        return result;
    }


    for await (
        const [name, item]
        of handle.entries()
    ) {

        if (
            item.kind === "file" &&
            name
                .toLowerCase()
                .endsWith(".md")
        ) {

            result.push(
                item
            );
        }
    }


    return result.sort(
        (a, b) =>

            a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
    );
}


/* =========================================================
   FE Action ID
========================================================= */

function act(
    name
) {

    const match =
        name.match(
            /^FE-(ACT-\d+)/i
        );


    return match
        ? match[1].toUpperCase()
        : "";
}


/* =========================================================
   FE Label
========================================================= */

function feLabel(
    name
) {

    const match =
        name.match(
            /^FE-(ACT-\d+)-(.+)\.md$/i
        );


    if (!match) {

        return name.replace(
            /\.md$/i,
            ""
        );
    }


    return (
        match[1] +
        " " +
        match[2]
            .replaceAll(
                "-",
                " "
            )
    );
}


/* =========================================================
   FE → API / BE Match
========================================================= */

function child(
    name,
    actionId,
    type
) {

    const upper =
        name.toUpperCase();


    return (

        upper.startsWith(
            "FE-" +
            actionId +
            "-"
        )

        &&

        upper.includes(
            "-" +
            type +
            "-"
        )
    );
}


/* =========================================================
   API / BE Label
========================================================= */

function childLabel(
    name,
    type
) {

    const regex =
        new RegExp(
            "-(" +
            type +
            "-\\d+)\\.md$",
            "i"
        );


    const match =
        name.match(
            regex
        );


    return match
        ? match[1].toUpperCase()
        : name.replace(
            /\.md$/i,
            ""
        );
}


/* =========================================================
   Main Active
========================================================= */

function setMainActive(
    button
) {

    q("#screenTab")
        .classList
        .remove(
            "active"
        );


    q("#feTab")
        .classList
        .remove(
            "active"
        );


    if (button) {

        button
            .classList
            .add(
                "active"
            );
    }
}


/* =========================================================
   Render File
========================================================= */

async function renderFile(
    handle
) {

    if (!handle) {

        return;
    }


    try {

        const target =
            await handle.getFile();


        const markdown =
            await target.text();


        renderMarkdown(
            markdown
        );


        q("#status")
            .innerHTML =

            "표시 문서: <b>" +

            escapeHtml(
                handle.name
            )

            + "</b>";
    }
    catch (error) {

        q("#viewer")
            .innerHTML =

            '<div class="empty">' +

            '문서를 읽을 수 없습니다.<br>' +

            escapeHtml(
                error.message
            )

            + '</div>';
    }
}


/* =========================================================
   Scan Screen Directories
========================================================= */

async function scan() {

    data.clear();


    for await (
        const [name, handle]
        of root.entries()
    ) {

        if (
            handle.kind !==
            "directory"
        ) {

            continue;
        }


        const screen =
            await file(
                handle,
                "SCREEN-" +
                name +
                ".md"
            );


        const frontend =
            await dir(
                handle,
                "frontend"
            );


        const api =
            await dir(
                handle,
                "api"
            );


        const backend =
            await dir(
                handle,
                "backend"
            );


        if (
            screen ||
            frontend ||
            api ||
            backend
        ) {

            data.set(
                name,
                {
                    screen,
                    frontend,
                    api,
                    backend
                }
            );
        }
    }


    const select =
        q("#screen");


    select.innerHTML =
        '<option value="">' +
        '화면 선택' +
        '</option>';


    [...data.keys()]

        .sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        )

        .forEach(
            name => {

                select.add(
                    new Option(
                        name,
                        name
                    )
                );
            }
        );


    q("#status")
        .textContent =

        data.size +
        "개 화면을 찾았습니다.";
}


/* =========================================================
   Select docs/analysis
========================================================= */

q("#pick")
    .onclick =
async () => {

    if (
        !window
            .showDirectoryPicker
    ) {

        alert(
            "현재 브라우저에서는 폴더 선택 기능을 지원하지 않습니다.\n\n" +
            "Chrome 또는 Edge 최신 버전에서 실행해 주세요."
        );

        return;
    }


    try {

        root =
            await window
                .showDirectoryPicker({
                    mode: "read"
                });


        await scan();

    }
    catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                error
            );
        }
    }
};


/* =========================================================
   Screen Change
========================================================= */

q("#screen")
    .onchange =
async event => {

    screenName =
        event.target.value;


    action = "";


    q("#sub")
        .classList
        .remove(
            "show"
        );


    q("#screenTab")
        .disabled =
        !screenName;


    q("#feTab")
        .disabled =
        !screenName;


    if (!screenName) {

        return;
    }


    await showScreen();
};


/* =========================================================
   SCREEN
========================================================= */

async function showScreen() {

    const current =
        data.get(
            screenName
        );


    if (!current) {

        return;
    }


    q("#sub")
        .classList
        .remove(
            "show"
        );


    setMainActive(
        q("#screenTab")
    );


    if (
        current.screen
    ) {

        await renderFile(
            current.screen
        );
    }
    else {

        q("#viewer")
            .innerHTML =

            '<div class="empty">' +
            'SCREEN 문서가 없습니다.' +
            '</div>';
    }
}


q("#screenTab")
    .onclick =
    showScreen;


/* =========================================================
   FE
========================================================= */

q("#feTab")
    .onclick =
async () => {

    const current =
        data.get(
            screenName
        );


    if (!current) {

        return;
    }


    setMainActive(
        q("#feTab")
    );


    q("#sub")
        .classList
        .add(
            "show"
        );


    q("#fes")
        .innerHTML = "";


    q("#apis")
        .innerHTML = "";


    q("#bes")
        .innerHTML = "";


    q("#apiRow")
        .style.display =
        "none";


    q("#beRow")
        .style.display =
        "none";


    const frontendFiles =
        await mds(
            current.frontend
        );


    if (
        !frontendFiles.length
    ) {

        q("#fes")
            .textContent =
            "FE 문서 없음";


        q("#viewer")
            .innerHTML =

            '<div class="empty">' +
            '이 화면에는 FE 문서가 없습니다.' +
            '</div>';

        return;
    }


    frontendFiles.forEach(
        handle => {

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                feLabel(
                    handle.name
                );


            button.title =
                handle.name;


            button.onclick =
                () =>

                    selectFE(
                        handle,
                        button
                    );


            q("#fes")
                .appendChild(
                    button
                );
        }
    );


    q("#viewer")
        .innerHTML =

        '<div class="empty">' +
        'FE 기능을 선택하세요.' +
        '</div>';
};


/* =========================================================
   Select FE
========================================================= */

async function selectFE(
    handle,
    button
) {

    action =
        act(
            handle.name
        );


    document
        .querySelectorAll(
            "#fes button"
        )
        .forEach(
            item =>

                item.classList
                    .remove(
                        "active"
                    )
        );


    button
        .classList
        .add(
            "active"
        );


    setMainActive(
        q("#feTab")
    );


    /*
       FE 문서 표시
    */

    await renderFile(
        handle
    );


    const current =
        data.get(
            screenName
        );


    /*
       선택 FE의 API
    */

    const apiFiles =
        (
            await mds(
                current.api
            )
        )
        .filter(
            item =>

                child(
                    item.name,
                    action,
                    "API"
                )
        );


    /*
       선택 FE의 BE
    */

    const backendFiles =
        (
            await mds(
                current.backend
            )
        )
        .filter(
            item =>

                child(
                    item.name,
                    action,
                    "BE"
                )
        );


    /*
       API / BE 생성
    */

    fillChildren(
        "#apis",
        "#apiRow",
        apiFiles,
        "API"
    );


    fillChildren(
        "#bes",
        "#beRow",
        backendFiles,
        "BE"
    );
}


/* =========================================================
   API / BE Buttons
========================================================= */

function fillChildren(
    box,
    row,
    items,
    type
) {

    const container =
        q(box);


    container.innerHTML =
        "";


    /*
       해당 FE에 문서가 없으면
       영역 자체 숨김
    */

    if (
        !items.length
    ) {

        q(row)
            .style.display =
            "none";

        return;
    }


    q(row)
        .style.display =
        "flex";


    items.forEach(
        handle => {

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                childLabel(
                    handle.name,
                    type
                );


            button.title =
                handle.name;


            button.onclick =
async () => {

    /*
       API / BE 선택 표시
    */

    document
        .querySelectorAll(
            "#apis button, #bes button"
        )
        .forEach(
            item =>

                item.classList
                    .remove(
                        "active"
                    )
        );


    button
        .classList
        .add(
            "active"
        );


    /*
       FE 선택 상태는 유지
       상단 UI도 유지
    */

    setMainActive(
        q("#feTab")
    );


    /*
       아래 문서만 변경
    */

    await renderFile(
        handle
    );
};


            container
                .appendChild(
                    button
                );
        }
    );
}


/* =========================================================
   Markdown Renderer
========================================================= */

function renderMarkdown(
    markdown
) {

    const html =
        markdownToHtml(
            markdown
        );


    q("#viewer")
        .innerHTML =
        html;


    window.scrollTo({
        top:
            q("#viewer")
                .offsetTop - 20,

        behavior:
            "auto"
    });
}


/* =========================================================
   Markdown → HTML
========================================================= */

function markdownToHtml(
    markdown
) {

    markdown =
        markdown.replace(
            /\r\n/g,
            "\n"
        );


    const lines =
        markdown.split(
            "\n"
        );


    let html = "";

    let index = 0;

    let inCode = false;

    let codeLanguage = "";

    let codeBuffer = [];

    let listType = null;


    while (
        index <
        lines.length
    ) {

        const line =
            lines[index];


        /* =================================================
           Code Block
        ================================================= */

        if (
            line.trim()
                .startsWith(
                    "```"
                )
        ) {

            closeList();


            if (
                !inCode
            ) {

                inCode =
                    true;


                codeLanguage =
                    line
                        .trim()
                        .substring(3)
                        .trim();


                codeBuffer =
                    [];
            }
            else {

                html +=

                    "<pre><code" +

                    (
                        codeLanguage

                            ? ' class="language-' +
                              escapeAttribute(
                                  codeLanguage
                              ) +
                              '"'

                            : ""
                    )

                    + ">" +

                    escapeHtml(
                        codeBuffer
                            .join(
                                "\n"
                            )
                    )

                    + "</code></pre>";


                inCode =
                    false;


                codeLanguage =
                    "";


                codeBuffer =
                    [];
            }


            index++;

            continue;
        }


        if (
            inCode
        ) {

            codeBuffer.push(
                line
            );


            index++;

            continue;
        }


        /* =================================================
           Table
        ================================================= */

        if (
            isTableHeader(
                lines,
                index
            )
        ) {

            closeList();


            const result =
                parseTable(
                    lines,
                    index
                );


            html +=
                result.html;


            index =
                result.nextIndex;


            continue;
        }


        /* =================================================
           Blank
        ================================================= */

        if (
            line.trim() ===
            ""
        ) {

            closeList();

            index++;

            continue;
        }


        /* =================================================
           Horizontal Rule
        ================================================= */

        if (
            /^(\s*)(---|\*\*\*|___)(\s*)$/
                .test(
                    line
                )
        ) {

            closeList();

            html +=
                "<hr>";

            index++;

            continue;
        }


        /* =================================================
           Heading
        ================================================= */

        const headingMatch =
            line.match(
                /^(#{1,6})\s+(.+)$/
            );


        if (
            headingMatch
        ) {

            closeList();


            const level =
                headingMatch[1]
                    .length;


            html +=

                "<h" +
                level +
                ">" +

                inlineMarkdown(
                    headingMatch[2]
                ) +

                "</h" +
                level +
                ">";


            index++;

            continue;
        }


        /* =================================================
           Blockquote
        ================================================= */

        if (
            line
                .trimStart()
                .startsWith(
                    ">"
                )
        ) {

            closeList();


            const quoteLines =
                [];


            while (
                index <
                    lines.length

                &&

                lines[index]
                    .trimStart()
                    .startsWith(
                        ">"
                    )
            ) {

                quoteLines.push(

                    lines[index]
                        .trimStart()
                        .replace(
                            /^>\s?/,
                            ""
                        )
                );


                index++;
            }


            html +=

                "<blockquote>" +

                quoteLines
                    .map(
                        item =>

                            item.trim()

                                ? inlineMarkdown(
                                    item
                                )

                                : "<br>"
                    )
                    .join(
                        "<br>"
                    )

                + "</blockquote>";


            continue;
        }


        /* =================================================
           Unordered List
        ================================================= */

        const ulMatch =
            line.match(
                /^\s*[-*+]\s+(.+)$/
            );


        if (
            ulMatch
        ) {

            if (
                listType !==
                "ul"
            ) {

                closeList();

                html +=
                    "<ul>";

                listType =
                    "ul";
            }


            html +=

                "<li>" +

                inlineMarkdown(
                    ulMatch[1]
                )

                + "</li>";


            index++;

            continue;
        }


        /* =================================================
           Ordered List
        ================================================= */

        const olMatch =
            line.match(
                /^\s*\d+\.\s+(.+)$/
            );


        if (
            olMatch
        ) {

            if (
                listType !==
                "ol"
            ) {

                closeList();

                html +=
                    "<ol>";

                listType =
                    "ol";
            }


            html +=

                "<li>" +

                inlineMarkdown(
                    olMatch[1]
                )

                + "</li>";


            index++;

            continue;
        }


        /* =================================================
           Paragraph
        ================================================= */

        closeList();


        const paragraphLines =
            [
                line
            ];


        index++;


        while (
            index <
            lines.length
        ) {

            const next =
                lines[index];


            if (
                next.trim() ===
                    ""

                ||

                next
                    .trim()
                    .startsWith(
                        "```"
                    )

                ||

                /^#{1,6}\s+/
                    .test(
                        next
                    )

                ||

                /^(\s*)(---|\*\*\*|___)(\s*)$/
                    .test(
                        next
                    )

                ||

                next
                    .trimStart()
                    .startsWith(
                        ">"
                    )

                ||

                /^\s*[-*+]\s+/
                    .test(
                        next
                    )

                ||

                /^\s*\d+\.\s+/
                    .test(
                        next
                    )

                ||

                isTableHeader(
                    lines,
                    index
                )
            ) {

                break;
            }


            paragraphLines.push(
                next
            );


            index++;
        }


        html +=

            "<p>" +

            paragraphLines
                .map(
                    item =>

                        inlineMarkdown(
                            item
                        )
                )
                .join(
                    "<br>"
                )

            + "</p>";
    }


    if (
        inCode
    ) {

        html +=

            "<pre><code>" +

            escapeHtml(
                codeBuffer
                    .join(
                        "\n"
                    )
            )

            + "</code></pre>";
    }


    closeList();


    return html;


    function closeList() {

        if (
            listType ===
            "ul"
        ) {

            html +=
                "</ul>";
        }


        if (
            listType ===
            "ol"
        ) {

            html +=
                "</ol>";
        }


        listType =
            null;
    }
}


/* =========================================================
   Markdown Table Detection
========================================================= */

function isTableHeader(
    lines,
    index
) {

    if (
        index + 1 >=
        lines.length
    ) {

        return false;
    }


    const first =
        lines[index]
            .trim();


    const second =
        lines[index + 1]
            .trim();


    if (
        !first.includes(
            "|"
        )
    ) {

        return false;
    }


    if (
        !second.includes(
            "|"
        )
    ) {

        return false;
    }


    const cells =
        splitTableRow(
            second
        );


    if (
        cells.length ===
        0
    ) {

        return false;
    }


    return cells.every(
        cell =>

            /^:?-{3,}:?$/
                .test(
                    cell.trim()
                )
    );
}


/* =========================================================
   Parse Markdown Table
========================================================= */

function parseTable(
    lines,
    startIndex
) {

    const headers =
        splitTableRow(
            lines[
                startIndex
            ]
        );


    let index =
        startIndex + 2;


    const rows =
        [];


    while (
        index <
        lines.length
    ) {

        const line =
            lines[index]
                .trim();


        if (
            line ===
                ""

            ||

            !line.includes(
                "|"
            )
        ) {

            break;
        }


        rows.push(
            splitTableRow(
                line
            )
        );


        index++;
    }


    let html =
        "<table>" +
        "<thead>" +
        "<tr>";


    for (
        const header
        of headers
    ) {

        html +=

            "<th>" +

            inlineMarkdown(
                header.trim()
            )

            + "</th>";
    }


    html +=
        "</tr>" +
        "</thead>" +
        "<tbody>";


    for (
        const row
        of rows
    ) {

        html +=
            "<tr>";


        for (
            let column = 0;
            column <
                headers.length;
            column++
        ) {

            const value =
                row[column] ??
                "";


            html +=

                "<td>" +

                inlineMarkdown(
                    value.trim()
                )

                + "</td>";
        }


        html +=
            "</tr>";
    }


    html +=
        "</tbody>" +
        "</table>";


    return {
        html:
            html,

        nextIndex:
            index
    };
}


/* =========================================================
   Split Table Row
========================================================= */

function splitTableRow(
    line
) {

    let value =
        line.trim();


    if (
        value.startsWith(
            "|"
        )
    ) {

        value =
            value.substring(
                1
            );
    }


    if (
        value.endsWith(
            "|"
        )
    ) {

        value =
            value.substring(
                0,
                value.length - 1
            );
    }


    return value.split(
        "|"
    );
}


/* =========================================================
   Inline Markdown
========================================================= */

function inlineMarkdown(
    text
) {

    /*
       HTML Escape 먼저 수행.
    */

    let value =
        escapeHtml(
            text
        );


    /*
       Inline Code
    */

    value =
        value.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    /*
       Bold
    */

    value =
        value.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    /*
       Italic
    */

    value =
        value.replace(
            /(?<!\*)\*([^*]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


    return value;
}
